    /* ============================== PROJECTS — WINDOW SHELL ============================== */
    .proj-window {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 22px 60px rgba(0, 0, 0, .45), 0 4px 16px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .06);
      background: var(--bg3);
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, .08);
    }

    [data-theme="light"] .proj-window {
      box-shadow: 0 22px 60px rgba(0, 0, 0, .18), 0 4px 16px rgba(0, 0, 0, .1), inset 0 1px 0 rgba(255, 255, 255, .9);
      border: 1px solid rgba(0, 0, 0, .14);
      background: #f0f0f0;
    }

    /* Window banner — traffic lights. Default hidden, shown only on mobile */
    .proj-window-titlebar {
      background: rgba(255, 255, 255, .06);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, .07);
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 40px;
      user-select: none;
      flex-shrink: 0;
      position: relative;
      display: none;
    }

    [data-theme="light"] .proj-window-titlebar {
      background: rgba(210, 210, 210, .85);
      border-bottom: 1px solid rgba(0, 0, 0, .1);
    }

    .proj-window-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .proj-window-title {
      font-family: var(--font2), sans-serif;
      font-size: .78rem;
      font-weight: 600;
      color: var(--text-bright);
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    [data-theme="light"] .proj-window-title {
      color: #1a1a1a;
    }

    /* Browser-style tab strip. Default hidden, shown only on desktop */
    .proj-browser-tabs {
      align-items: flex-end;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 0 8px;
      gap: 0;
      overflow-x: auto;
      flex-shrink: 0;
      display: none;
    }

    .proj-browser-tabs::-webkit-scrollbar {
      height: 3px;
    }

    .proj-browser-tabs::-webkit-scrollbar-track {
      background: transparent;
    }

    .proj-browser-tabs::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .proj-browser-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px 7px;
      background: transparent;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      font-family: var(--font), monospace;
      font-size: .74rem;
      font-weight: 500;
      color: var(--text-dim);
      white-space: nowrap;
      margin-bottom: -1px;
      transition: background .15s, color .15s;
    }

    .proj-browser-tab:hover {
      background: rgba(255, 255, 255, .05);
      color: var(--text);
    }

    [data-theme="light"] .proj-browser-tab:hover {
      background: rgba(0, 0, 0, .04);
      color: #333;
    }

    .proj-browser-tab.active {
      background: var(--bg3);
      color: var(--text-bright);
      border-color: var(--border);
      font-weight: 700;
    }

    [data-theme="light"] .proj-browser-tab.active {
      background: #f5f5f5;
      color: #111;
      border-color: rgba(0, 0, 0, .12);
    }

    /* Active tab name glows in accent */
    .proj-browser-tab.active .tab-name {
      color: var(--accent);
      text-shadow: 0 0 8px var(--accent);
    }

    [data-theme="light"] .proj-browser-tab.active .tab-name {
      color: var(--accent);
      text-shadow: 0 0 6px rgba(225, 88, 36, .5);
    }

    .proj-browser-tab-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .proj-browser-tab .tab-ext {
      font-size: .66rem;
      opacity: .5;
    }

    /* Finder body: sidebar + content side by side */
    .proj-finder-body {
      display: flex;
      flex: 1;
      min-height: 0;
      flex-direction: row;
    }

    /* IDE / Directory sidebar. Default hidden, shown only on mobile */
    .proj-ide-sidebar {
      width: 190px;
      flex-shrink: 0;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      flex-direction: column;
      padding: 10px 0;
      gap: 2px;
      overflow-y: auto;
      display: none;
    }

    [data-theme="light"] .proj-ide-sidebar {
      background: rgba(0, 0, 0, .03);
      border-right: 1px solid rgba(0, 0, 0, .1);
    }

    .proj-ide-sidebar-label {
      font-family: var(--font);
      font-size: .56rem;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 4px 14px 10px;
      opacity: .45;
    }

    .proj-ide-item {
      background: transparent;
      border: none;
      border-left: 2px solid transparent;
      font-family: var(--font);
      font-size: .73rem;
      color: var(--text-dim);
      padding: 7px 10px 7px 12px;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: color .15s, background .15s, border-color .15s;
      text-align: left;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
    }

    .proj-ide-item:hover {
      color: var(--text-bright);
      background: rgba(255, 255, 255, .05);
    }

    [data-theme="light"] .proj-ide-item:hover {
      background: rgba(0, 0, 0, .04);
      color: #111;
    }

    /* Active: left accent bar + glow */
    .proj-ide-item.active {
      color: var(--accent) !important;
      text-shadow: 0 0 8px var(--accent), 0 0 20px var(--accent);
      background: rgba(57, 255, 20, .07);
      border-left-color: var(--accent);
    }

    [data-theme="light"] .proj-ide-item.active {
      color: var(--accent) !important;
      text-shadow: 0 0 6px rgba(225, 88, 36, .5);
      background: rgba(225, 88, 36, .08);
      border-left-color: var(--accent);
    }

    .proj-ide-item .ide-item-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      opacity: .7;
    }

    .proj-ide-item .ide-item-ext {
      font-size: .65rem;
      opacity: .5;
    }

    .proj-ide-item.active .ide-item-ext {
      color: var(--accent);
      opacity: .6;
    }

    /* ============================== PROJECTS — TREE BLOCK INDICATOR ============================== */

    /* Make tree rows clickable */
    .tree-row-btn {
      background: none;
      border: none;
      font-family: var(--font);
      font-size: 0.8rem;
      line-height: 1.7;
      color: var(--text-dim);
      padding: 0;
      text-align: left;
      transition: color .15s;
      display: inline;
      white-space: nowrap;
    }

    .tree-row-btn:hover {
      color: var(--text-bright);
    }

    /* Active: strong glow in accent */
    .tree-row-btn.active {
      color: var(--accent) !important;
      text-shadow: 0 0 10px var(--accent), 0 0 22px var(--accent), 0 0 40px var(--accent);
    }

    /* Light mode: deeper orange with solid color + strong shadow */
    [data-theme="light"] .tree-row-btn.active {
      color: #c94800 !important;
      text-shadow: 0 0 8px rgba(201, 72, 0, .7), 0 0 16px rgba(201, 72, 0, .4);
      font-weight: 700;
    }

    /* ============================== RESPONSIVE BREAKPOINTS ============================== */

    /* DESKTOP ≥ 769px:
       - Terminal tree block VISIBLE with glow indicator
       - Browser tab strip (project_x.js) visible
       - macOS banner hidden
       - IDE sidebar hidden
    */
    @media (min-width: 769px) {
      .proj-window-titlebar {
        display: none !important;
      }

      .proj-browser-tabs {
        display: flex !important;
      }

      .proj-ide-sidebar {
        display: none !important;
      }

      .proj-term-block {
        display: block !important;
      }
    }

    /* MOBILE ≤ 768px:
       - macOS banner visible
       - Browser tab strip hidden
       - IDE sidebar visible (vertical column)
       - Terminal tree block HIDDEN
    */
    @media (max-width: 768px) {
      .proj-window-titlebar {
        display: flex !important;
      }

      .proj-browser-tabs {
        display: none !important;
      }

      .proj-ide-sidebar {
        display: flex !important;
        width: 140px;
      }

      .proj-term-block {
        display: none !important;
      }

      .proj-file-content {
        padding: 16px 14px;
      }

      .proj-img-wrap {
        aspect-ratio: 4 / 3;
      }
    }

    @media (max-width: 400px) {
      .proj-ide-sidebar {
        width: 118px;
      }

      .proj-ide-item {
        font-size: 0.64rem;
        padding: 6px 8px 6px 10px;
        gap: 5px;
      }
    }

    .proj-detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .proj-detail-title {
      font-size: 1.25rem;
      color: var(--text-bright);
      font-weight: 700;
      font-family: var(--font);
      letter-spacing: 0.03em;
      margin-bottom: 4px;
    }

    .proj-detail-name {
      font-size: 0.68rem;
      color: var(--accent);
      font-weight: 700;
      font-family: var(--font);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .proj-detail-desc {
      font-size: 0.78rem;
      color: var(--text);
      line-height: 1.95;
      margin-bottom: 18px;
      font-family: var(--font);
      border-left: 2px solid var(--border);
      padding-left: 12px;
    }

    .proj-detail-footer {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .proj-gh-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 18px;
      background: transparent;
      border: 1.5px solid var(--accent);
      color: var(--accent);
      font-family: var(--font);
      font-size: 0.7rem;
      font-weight: 600;
      border-radius: 20px;
      text-decoration: none !important;
      transition: background 0.2s, box-shadow 0.2s;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 0.03em;
    }

    .proj-gh-btn *,
    .proj-gh-btn::before,
    .proj-gh-btn::after {
      text-decoration: none !important;
    }

    .proj-gh-btn:hover {
      background: var(--accent-dim);
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
      text-decoration: none !important;
    }

    [data-theme="light"] .proj-gh-btn:hover {
      box-shadow: 0 0 8px rgba(225, 88, 36, 0.2);
    }

    .proj-status-badge {
      font-size: 0.68rem;
      font-family: var(--font);
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid;
    }


    /* ── CRT / Glitch image wrapper ── */
    .proj-img-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--accent);
      border-radius: 4px;
      margin-bottom: 18px;
      background: var(--surface);
    }

    .proj-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: filter 0.35s ease, transform 0.35s ease;
      filter: brightness(0.85) saturate(0.9);
    }

    /* Scanline overlay */
    .proj-img-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg,
          transparent,
          transparent 3px,
          rgba(0, 0, 0, 0.13) 3px,
          rgba(0, 0, 0, 0.13) 4px);
      pointer-events: none;
      z-index: 2;
    }

    /* Accent tint overlay */
    .proj-img-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
          transparent 55%,
          rgba(57, 255, 20, 0.07) 100%);
      pointer-events: none;
      z-index: 3;
      transition: opacity 0.35s;
    }

    [data-theme="light"] .proj-img-wrap::before {
      background: linear-gradient(180deg,
          transparent 55%,
          rgba(225, 88, 36, 0.06) 100%);
    }

    /* Hover: bloom */
    .proj-file-content:hover .proj-img-wrap img,
    .proj-img-wrap:hover img {
      filter: brightness(1.08) saturate(1.1);
      transform: scale(1.02);
    }

    .proj-img-wrap:hover::before {
      opacity: 0.5;
    }

    /* Glitch flicker on card hover — subtle */
    .proj-cell:hover .proj-cell-img img {
      filter: brightness(1.1) saturate(1.15);
    }

    /* proj-cell image */
    .proj-cell-img {
      width: 100%;
      height: 140px;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .proj-cell-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: filter 0.3s, transform 0.3s;
      filter: brightness(0.82) saturate(0.85);
    }

    .proj-cell-img::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg,
          transparent,
          transparent 3px,
          rgba(0, 0, 0, 0.1) 3px,
          rgba(0, 0, 0, 0.1) 4px);
      pointer-events: none;
      z-index: 2;
    }

    .proj-cell:hover .proj-cell-img img {
      filter: brightness(1.05) saturate(1.1);
      transform: scale(1.03);
    }

    /* proj-cell-title upgrade */
    .proj-cell-title {
      font-size: 0.92rem;
      color: var(--text-bright);
      font-weight: 700;
      font-family: var(--font);
      letter-spacing: 0.02em;
    }

    .proj-cell-desc {
      font-size: 0.73rem;
      color: var(--text);
      line-height: 1.8;
      flex: 1;
      font-family: var(--font);
    }

    /* ── Mobile: hide project descriptions in the card grid ── */
    @media (max-width: 768px) {
      .proj-cell-desc {
        display: none;
      }

      /* Give the body a bit more breathing room without the desc */
      .proj-cell-body {
        gap: 8px;
      }
    }

    /* placeholder inside image */
    .proj-img-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 0;
    }

    /* ── Mobile/Desktop Visibility Utilities ── */
    @media (max-width: 768px) {
      .desktop-only { display: none !important; }
      .mobile-only { display: block !important; }
      .mobile-only-inline { display: inline !important; }
      
      .bk-item-name { font-size: 0.65rem !important; }
      .bk-item-sub { font-size: 0.55rem !important; }
      .bk-items-lbl { font-size: 0.65rem !important; }
    }
    @media (min-width: 769px) {
      .mobile-only, .mobile-only-inline { display: none !important; }
    }

    /* ============================== SCROLL INDICATOR ============================== */
    .scroll-indicator {
      position: fixed;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 1000;
    }

    .scroll-dot-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: flex-end;
      text-decoration: none;
      color: var(--text-dim);
      font-family: var(--font);
      font-size: 0.65rem;
      transition: color 0.3s;
    }

    .scroll-dot-wrap:hover {
      color: var(--text-bright);
    }

    .scroll-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1.5px solid var(--text-dim);
      transition: all 0.3s;
      background: transparent;
    }

    .scroll-dot-wrap.active {
      color: var(--accent);
    }

    .scroll-dot-wrap.active .scroll-dot {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .scroll-label {
      opacity: 0;
      transform: translateX(10px);
      transition: all 0.3s;
      pointer-events: none;
    }

    .scroll-indicator:hover .scroll-label,
    .scroll-dot-wrap.active .scroll-label {
      opacity: 1;
      transform: translateX(0);
    }

    /* ============================== TOAST ============================== */
    .toast-msg {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      font-family: var(--font);
      font-size: 0.74rem;
      color: var(--text-dim);
      pointer-events: none;
      z-index: 9999;
      transform: translateY(100%);
      opacity: 0;
      transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.45s ease, background 0.4s, border-color 0.4s;
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-msg-text {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast-msg-text::before {
      content: '$';
      color: var(--accent);
      font-weight: 700;
    }

    .toast-msg-hint {
      font-size: 0.65rem;
      color: var(--text-dim);
      opacity: 0.5;
      letter-spacing: 0.04em;
    }

    /* ============================== BOOK FLIP ANIMATIONS ============================== */
    .bk-flip-left {
      animation: flipOutLeft 0.15s forwards ease-in, flipInLeft 0.15s 0.15s forwards ease-out;
    }

    .bk-flip-right {
      animation: flipOutRight 0.15s forwards ease-in, flipInRight 0.15s 0.15s forwards ease-out;
    }

    @keyframes flipOutLeft {
      0% {
        transform: perspective(800px) rotateY(0);
        opacity: 1;
      }

      100% {
        transform: perspective(800px) rotateY(90deg);
        opacity: 0;
      }
    }

    @keyframes flipInLeft {
      0% {
        transform: perspective(800px) rotateY(-90deg);
        opacity: 0;
      }

      100% {
        transform: perspective(800px) rotateY(0);
        opacity: 1;
      }
    }

    @keyframes flipOutRight {
      0% {
        transform: perspective(800px) rotateY(0);
        opacity: 1;
      }

      100% {
        transform: perspective(800px) rotateY(-90deg);
        opacity: 0;
      }
    }

    @keyframes flipInRight {
      0% {
        transform: perspective(800px) rotateY(90deg);
        opacity: 0;
      }

      100% {
        transform: perspective(800px) rotateY(0);
        opacity: 1;
      }
    }

    /* ============================== CONTACT MODAL ============================== */
    /* ============================== MAC SYSTEM ALERT MODAL (Sent Message) ============================== */
    .contact-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 0.2s forwards;
    }

    .contact-modal {
      font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      background: var(--mac-modal-bg, #DDDBD8);
      border: 1px solid var(--mac-modal-border, rgba(0, 0, 0, 0.18));
      border-radius: 16px;
      width: 90%;
      max-width: 360px;
      overflow: hidden;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35), 0 4px 20px rgba(0, 0, 0, 0.15);
      opacity: 0;
      animation: macAlertIn 0.28s cubic-bezier(0.34, 1.3, 0.64, 1) forwards;
      position: relative;
    }

    [data-theme="light"] {
      --mac-modal-bg: rgba(242, 237, 230, 0.55);
      --mac-modal-border: rgba(225, 88, 36, 0.28);
      --mac-modal-icon-bg: rgba(225, 88, 36, 0.12);
      --mac-modal-title: #1a1a1a;
      --mac-modal-text: #3a3a3a;
      --mac-modal-muted: #888;
      --mac-modal-btn-bg: #E15824;
      --mac-modal-btn-hover: #c94800;
      --mac-modal-btn-cancel-bg: rgba(225, 88, 36, 0.08);
      --mac-modal-btn-cancel-border: rgba(225, 88, 36, 0.22);
      --mac-modal-btn-cancel-text: #2a1a0a;
      --mac-modal-separator: rgba(225, 88, 36, 0.12);
    }

    :root {
      --mac-modal-bg: rgba(8, 22, 10, 0.55);
      --mac-modal-border: rgba(57, 255, 20, 0.22);
      --mac-modal-icon-bg: rgba(57, 255, 20, 0.1);
      --mac-modal-title: #e0ffe0;
      --mac-modal-text: #98c898;
      --mac-modal-muted: #4a7a4a;
      --mac-modal-btn-bg: #39ff14;
      --mac-modal-btn-hover: #2ecc10;
      --mac-modal-btn-cancel-bg: rgba(57, 255, 20, 0.07);
      --mac-modal-btn-cancel-border: rgba(57, 255, 20, 0.18);
      --mac-modal-btn-cancel-text: #98c898;
      --mac-modal-separator: rgba(57, 255, 20, 0.1);
    }

    @keyframes macAlertIn {
      from {
        transform: scale(0.88);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .contact-modal-hd {
      display: none;
    }

    .contact-modal-body {
      padding: 32px 28px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .contact-modal-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contact-modal-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--mac-modal-title);
      font-style: normal;
      margin-bottom: 8px;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .contact-modal-text {
      font-size: 0.82rem;
      color: var(--mac-modal-text);
      line-height: 1.55;
      margin-bottom: 6px;
      font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    }

    .contact-modal-muted {
      font-size: 0.75rem;
      color: var(--mac-modal-muted);
      line-height: 1.5;
      margin-bottom: 24px;
      font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    }

    .contact-modal-actions {
      width: 100%;
      border-top: 1px solid var(--mac-modal-separator);
      padding: 14px 0 0;
      display: flex;
      gap: 8px;
    }

    .contact-modal-actions.single {
      display: block;
    }

    .mac-btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: 10px;
      font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      border: none;
      transition: all 0.15s;
    }

    .mac-btn-primary {
      background: var(--mac-modal-btn-bg);
      color: #fff;
    }

    .mac-btn-primary:hover {
      background: var(--mac-modal-btn-hover);
    }

    .mac-btn-cancel {
      background: var(--mac-modal-btn-cancel-bg);
      color: var(--mac-modal-btn-cancel-text);
      border: 1px solid var(--mac-modal-btn-cancel-border);
    }

    .mac-btn-cancel:hover {
      filter: brightness(0.95);
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      to {
        transform: translateY(0);
      }
    }

    /* ============================== MAC SYSTEM ALERT MODAL (Theme Prompt) ============================== */
    .retro-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 0.2s forwards;
    }

    .retro-dialog {
      font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      background: var(--mac-modal-bg);
      backdrop-filter: blur(24px) saturate(1.8);
      -webkit-backdrop-filter: blur(24px) saturate(1.8);
      border: 1px solid var(--mac-modal-border);
      border-radius: 16px;
      width: 90%;
      max-width: 340px;
      overflow: hidden;
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.35),
        0 4px 20px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      opacity: 0;
      animation: macAlertIn 0.28s cubic-bezier(0.34, 1.3, 0.64, 1) forwards;
    }

    [data-theme="light"] .retro-dialog {
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.18),
        0 4px 20px rgba(225, 88, 36, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .retro-dialog-titlebar {
      display: none;
    }

    .retro-dialog-titlebar-left {
      display: none;
    }

    .retro-title-icon {
      display: none;
    }

    .retro-close-btn {
      display: none;
    }

    .retro-prompt-line {
      display: none;
    }

    .retro-divider {
      display: none;
    }

    .retro-cursor {
      display: none;
    }

    .retro-status-bar {
      display: none;
    }

    .retro-dialog-body {
      padding: 32px 28px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .retro-dialog-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
    }

    .retro-heading {
      font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;

    /* ============================== FILE CABINET ============================== */
    .fc-cabinet {

    /* ==============================
       MOBILE: BOOK PORTAL & TAROT CARDS
       Synchronized scaling — font-size drives dimensions
    ============================== */

    /* ── Base font-size anchor on the components ── */
    /* Everything inside uses `em` so one clamp() scales it all */
    .bk-portal {
      font-size: clamp(0.6rem, 2.2vw, 1rem);
      /* anchor */
    }

    .tarot-spread {
      font-size: clamp(0.55rem, 2vw, 1rem);
      /* anchor */
    }

    /* ── Prevent any text inside book pages from bleeding ── */
    .bk-page-left,
    .bk-page-right {
      word-break: break-word;
      overflow-wrap: break-word;
      overflow: hidden;
    }

    .bk-pg-title,
    .bk-pg-desc,
    .bk-pg-cmd,
    .bk-tag,
    .bk-item-name,
    .bk-item-sub {
      word-break: break-word;
      overflow-wrap: break-word;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       BOOK PORTAL — MOBILE SCALING
       Two-page horizontal layout is preserved at ALL screen sizes.
       Content is scaled down proportionally; no stacking ever occurs.
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

    /* ── 600 px and below ── */
    @media (max-width: 600px) {

      /*
       * Portal fills 95 vw and stays perfectly centred.
       * Height is derived from the aspect ratio of the content:
       * desktop is 780 × 510 ≈ 1.53:1, so height = 95vw / 1.53 ≈ 62vw.
       * We clamp it so it never overflows the viewport vertically.
       */
      .bk-portal {
        width: 95vw !important;
        height: min(62vw, 82vh) !important;
        /* Guaranteed perfect centring regardless of width */
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.82);
      }

      .bk-portal.bk-portal-open {
        transform: translate(-50%, -50%) scale(1);
      }

      /*
       * Keep the two-page grid — explicitly force row direction
       * so no prior rule can collapse it to a column.
       */
      .bk-open-book {
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
        flex-direction: row !important;
        /* belt-and-suspenders for flex fallback */
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Tighten page padding so copy has more horizontal room */
      .bk-page-left {
        padding: 12px 10px 10px 12px;
      }

      .bk-page-right {
        padding: 12px 12px 10px 10px;
      }

      /* ── Shrink the image placeholder from 80 px → 44 px ── */
      .bk-img-area {
        width: 44px !important;
        height: 44px !important;
        flex-shrink: 0;
      }

      /* Hide the label inside the placeholder — too small to read */
      .bk-img-area span {
        display: none;
      }

      /* ── Typography — scale every text element proportionally ── */
      /* Title: was 1.0 rem desktop, now fluid with viewport */
      .bk-pg-title {
        font-size: clamp(0.55rem, 2.2vw, 0.85rem);
        margin-bottom: 8px !important;
        line-height: 1.2;
      }

      .bk-pg-desc {
        font-size: clamp(0.5rem, 1.8vw, 0.68rem);
        line-height: 1.6;
        margin-bottom: 6px;
      }

      .bk-pg-cmd {
        font-size: clamp(0.44rem, 1.6vw, 0.6rem);
        margin-bottom: 8px;
      }

      .bk-items-lbl {
        font-size: clamp(0.44rem, 1.6vw, 0.58rem);
        margin-bottom: 6px !important;
      }

      .bk-item {
        padding: 5px 7px;
      }

      .bk-item-name {
        font-size: clamp(0.48rem, 1.8vw, 0.62rem);
        margin-bottom: 1px;
      }

      .bk-item-sub {
        font-size: clamp(0.42rem, 1.5vw, 0.55rem);
      }

      .bk-items-grid {
        gap: 4px;
      }

      .bk-tag {
        font-size: clamp(0.42rem, 1.5vw, 0.55rem);
        padding: 2px 5px;
      }

      /* Corner decorations — shrink to avoid eating into content */
      .bk-corner {
        width: 12px;
        height: 12px;
      }

      .bk-corner-tl {
        top: 7px;
        left: 7px;
      }

      .bk-corner-br {
        bottom: 7px;
        right: 7px;
      }

      /* Page number */
      .bk-page-num {
        font-size: 0.42rem;
        bottom: 5px;
      }

      .bk-page-left .bk-page-num {
        left: 10px;
      }

      .bk-page-right .bk-page-num {
        right: 10px;
      }

      /* Bookmark close tab — keep on right edge, just tighter */
      .bk-bookmark {
        width: 16px;
        padding: 8px 0;
        top: 44%;
        right: -1px;
        writing-mode: vertical-lr;
        transform: translateY(-50%);
        border-radius: 5px 0 0 5px;
      }

      .bk-bookmark:hover {
        width: 22px;
      }

      .bk-bookmark-text {
        font-size: 0.42rem;
        transform: rotate(180deg);
      }
    }

    /* ── 400 px and below (very small phones) ── */
    @media (max-width: 400px) {
      .bk-portal {
        width: 98vw !important;
        height: min(65vw, 80vh) !important;
      }

      .bk-pg-title {
        font-size: clamp(0.48rem, 2.6vw, 0.65rem);
      }

      .bk-pg-desc,
      .bk-pg-cmd,
      .bk-items-lbl,
      .bk-item-name,
      .bk-item-sub,
      .bk-tag {
        font-size: clamp(0.4rem, 2vw, 0.52rem);
      }

      .bk-img-area {
        width: 36px !important;
        height: 36px !important;
      }

      .bk-page-left,
      .bk-page-right {
        padding: 9px 7px 8px;
      }
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       BREAKPOINT: mobile — tarot cards
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    @media (max-width: 768px) {

      /* ── TAROT: 2-column grid, no horizontal bleed ── */
      .tarot-spread {
        /* Proportional font anchor for mobile */
        font-size: clamp(0.5rem, 2.5vw, 0.8rem);
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        /* Prevent the grid from escaping its container */
        max-width: 100%;
        overflow: hidden;
      }

      /* Scale star symbol larger for readability */
      .tc-star {
        font-size: clamp(1.6rem, 5vw, 2.2rem);
        /* bigger, proportional */
      }

      /* Slightly tighter front-face padding to free space for desc */
      .tc-front {
        padding: 10px 8px;
        gap: 5px;
      }

      /* Description: bigger, wraps cleanly */
      .tc-up-desc {
        font-size: clamp(0.52rem, 1.8vw, 0.6rem);
        word-break: break-word;
        overflow-wrap: break-word;
        line-height: 1.6;
      }

      /* Icon — slightly smaller to reclaim vertical space */
      .tc-up-icon {
        font-size: clamp(1.4rem, 4.5vw, 2rem);
      }

      /* Title, hint — fluid */
      .tc-up-title {
        font-size: clamp(0.52rem, 1.6vw, 0.6rem);
      }

      .tc-up-hint {
        font-size: clamp(0.44rem, 1.4vw, 0.5rem);
      }

      /* Card name on back face */
      .tc-name {
        font-size: clamp(0.44rem, 1.5vw, 0.52rem);
      }

      /* Suppress the hover-scale transforms on touch — they don't make sense */
      .tarot-spread:has(.tc-outer:hover) .tc-outer,
      .tarot-spread:has(.tc-outer:hover) .tc-outer:hover {
        opacity: 1;
        filter: none;
        transform: none;
      }
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       BREAKPOINT: very small phones — tarot single column
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    @media (max-width: 420px) {
      .tarot-spread {
        grid-template-columns: 1fr;
        gap: 16px;
        /* Centre single card */
        justify-items: center;
      }

      /* Cap card width so it doesn't stretch edge-to-edge */
      .tc-outer {
        max-width: 200px;
        width: 100%;
      }

      /* Full-width book portal on tiny phones */
      .bk-portal {
        width: 96vw !important;
        font-size: clamp(0.48rem, 3vw, 0.7rem);
      }
    }
  </style>
</head>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ============================== PARTICLE SYSTEM (canvas) ============================== */
    function ParticleSystem() {
      useEffect(() => {
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let animId;
        let time = 0;

        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resize();
        window.addEventListener('resize', resize);

        function drawBlackhole(x, y, t) {
          const theme = document.documentElement.getAttribute('data-theme');
          if (theme === 'light') {
            const glow = ctx.createRadialGradient(x, y, 0, x, y, 18);
            glow.addColorStop(0, 'rgba(0,128,128,0.35)');
            glow.addColorStop(0.4, 'rgba(0,128,128,0.15)');
            glow.addColorStop(1, 'rgba(0,128,128,0)');

            ctx.beginPath();
            ctx.arc(x, y, 18, 0, Math.PI * 2);
            ctx.fillStyle = glow;
            ctx.fill();

            // Solid teal center
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(1,67,70,1)';
            ctx.fill();
          } else {
            // Dark mode: neon green glowing ball
            // Outer soft glow bloom
            const glow = ctx.createRadialGradient(x, y, 0, x, y, 18);
            glow.addColorStop(0, 'rgba(57,255,20,0.35)');
            glow.addColorStop(0.4, 'rgba(57,255,20,0.12)');
            glow.addColorStop(1, 'rgba(57,255,20,0)');
            ctx.beginPath();
            ctx.arc(x, y, 18, 0, Math.PI * 2);
            ctx.fillStyle = glow;
            ctx.fill();

            // Mid glow ring
            const mid = ctx.createRadialGradient(x, y, 0, x, y, 7);
            mid.addColorStop(0, 'rgba(200,255,160,0.9)');
            mid.addColorStop(0.5, 'rgba(57,255,20,0.8)');
            mid.addColorStop(1, 'rgba(57,255,20,0)');
            ctx.beginPath();
            ctx.arc(x, y, 7, 0, Math.PI * 2);
            ctx.fillStyle = mid;
            ctx.fill();

            // Bright core
            ctx.beginPath();
            ctx.arc(x, y, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(220,255,200,1)';
            ctx.fill();
          }
        }

        const onMove = e => { mouse.x = e.clientX; mouse.y = e.clientY; };
        document.addEventListener('mousemove', onMove);

        const loop = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          time += 0.016;
          drawBlackhole(mouse.x, mouse.y, time);
          animId = requestAnimationFrame(loop);
        };
        loop();

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('resize', resize);
          document.removeEventListener('mousemove', onMove);
        };
      }, []);
      return null;
    }

    // Cursor is now the blackhole itself — no separate cursor needed

    function ToastMessage() {
      const [show, setShow] = useState(false);
      const [dismissed, setDismissed] = useState(false);

      useEffect(() => {
        if (dismissed) return;
        const t1 = setTimeout(() => setShow(true), 1500);
        const t2 = setTimeout(() => {
          setShow(false);
        }, 4500); // 1.5s delay + 3s visible
        const t3 = setTimeout(() => {
          setDismissed(true);
        }, 5000); // Remove from DOM after transition
        return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
      }, [dismissed]);

      if (dismissed) return null;

      return (
        <div className={`toast-msg ${show ? 'show' : ''}`}>
          <span className="toast-msg-text">
            Theme switches automatically as you scroll — or click the logo to toggle.
          </span>
          <span className="toast-msg-hint">[ auto ]</span>
        </div>
      );
    }

    /* ── New BookShelf component ── */
    function BookShelf({ openId, setOpenId }) {
      const themeAttr = document.documentElement.getAttribute('data-theme');
      const isDark = themeAttr !== 'light';
      const activeBook = BOOKS.find(b => b.id === openId);
      const pal = activeBook
        ? (isDark ? BOOK_PALETTE[activeBook.paletteIdx].dark : BOOK_PALETTE[activeBook.paletteIdx].light)
        : null;

      const [pageIdx, setPageIdx] = useState(0);
      const [isMobile, setIsMobile] = useState(() => window.matchMedia('(max-width: 768px)').matches);
      const ITEMS_PER_PAGE = isMobile ? 2 : 4;
      const [isFlipping, setIsFlipping] = useState(false);

      React.useEffect(() => {
        const mq = window.matchMedia('(max-width: 768px)');
        const handler = (e) => setIsMobile(e.matches);
        mq.addEventListener('change', handler);
        return () => mq.removeEventListener('change', handler);
      }, []);

      React.useEffect(() => {
        setPageIdx(0);
      }, [openId]);

      const handleNextPage = (e) => {
        e.stopPropagation();
        if (activeBook && (pageIdx + 1) * ITEMS_PER_PAGE < activeBook.items.length) {
          setIsFlipping(true);
          setTimeout(() => {
            setPageIdx(p => p + 1);
            setIsFlipping(false);
          }, 300);
        }
      };

      const handlePrevPage = (e) => {
        e.stopPropagation();
        if (pageIdx > 0) {
          setIsFlipping(true);
          setTimeout(() => {
            setPageIdx(p => p - 1);
            setIsFlipping(false);
          }, 300);
        }
      };

      const currentItems = activeBook ? activeBook.items.slice(pageIdx * ITEMS_PER_PAGE, (pageIdx + 1) * ITEMS_PER_PAGE) : [];
      const totalPages = activeBook ? Math.ceil(activeBook.items.length / ITEMS_PER_PAGE) : 0;

      return (
        <div style={{ position: 'relative' }}>
          {/* Dim overlay */}
          <div
            className={`bk-overlay${openId ? ' bk-overlay-active' : ''}`}
            onClick={() => setOpenId(null)}
          />

          <div className="bookshelf-hint">// interests — click any book to open</div>

          {/* The shelf */}
          <div className="shelf-plank">
            {BOOKS.map(book => (
              <Book
                key={book.id}
                book={book}
                isOpen={openId === book.id}
                onToggle={() => setOpenId(openId === book.id ? null : book.id)}
                theme={themeAttr}
              />
            ))}
          </div>

          {/* Open book portal — Pinterest fly-to-center */}
          <div
            className={`bk-portal${openId ? ' bk-portal-open' : ''}`}
            style={pal ? {
              '--bk-active-glow': pal.glow,
            } : {}}
          >
            {activeBook && pal && (
              <div className="bk-open-book">
                {/* LEFT PAGE */}
                <div className={`bk-page-left ${isFlipping ? 'bk-flip-left' : ''}`} style={isDark ? { background: `color-mix(in srgb, ${pal.bg} 85%, var(--bg2))` } : {}}>
                  <div className="bk-corner bk-corner-tl" style={{ borderColor: pal.glow }} />

                  <div className="bk-pg-title" style={{ color: pal.glow, marginBottom: '15px', fontSize: isMobile ? '0.8rem' : '1.1rem' }}>
                    {activeBook.label} ({pageIdx + 1}/{totalPages})
                  </div>

                  {/* Left Page Items List */}
                  <div style={{ display: 'flex', flexDirection: 'column', gap: isMobile ? '12px' : '20px', flex: 1 }}>
                    {currentItems.map((item, idx) => (
                      <div key={idx} style={{ display: 'flex', flexDirection: 'column', gap: '4px' }}>
                        <div style={{ color: pal.glow, fontWeight: 'bold', fontSize: isMobile ? '0.75rem' : '0.9rem' }}>{item.name}</div>
                        <div style={{ color: pal.text, fontSize: isMobile ? '0.65rem' : '0.75rem', opacity: 0.8 }}>{item.sub}</div>
                      </div>
                    ))}
                  </div>

                  <span className="bk-page-num">{pageIdx * 2 + 1}</span>
                  <div className="bk-corner bk-corner-br" style={{ borderColor: pal.glow }} />
                </div>

                {/* RIGHT PAGE */}
                <div className={`bk-page-right ${isFlipping ? 'bk-flip-right' : ''}`}>
                  <div className="bk-corner bk-corner-tl" style={{ borderColor: pal.glow, opacity: 0.12 }} />

                  <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
                    {/* Fixed Notable Entries Header */}
                    <div className="bk-items-lbl" style={{ marginBottom: '15px' }}>// notable entries</div>

                    {/* Fixed Grid for Right Side */}
                    <div className="bk-items-grid" style={{ flex: 1 }}>
                      {currentItems.map((item, i) => (
                        <div key={i} className="bk-item" style={{ '--bk-active-glow': pal.glow }}>
                          <div className="bk-item-name">{item.name}</div>
                          <div className="bk-item-sub">{item.sub}</div>
                        </div>
                      ))}
                    </div>

                    {/* Pagination Controls Fixed at Bottom */}
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 'auto', paddingTop: '15px' }}>
                      <button
                        className="btn btn-outline"
                        onClick={handlePrevPage}
                        style={{
                          visibility: pageIdx > 0 ? 'visible' : 'hidden',
                          padding: '5px 10px', fontSize: '0.7rem',
                          borderColor: pal.glow, color: pal.glow
                        }}
                      >
                        ← Prev
                      </button>
                      <button
                        className="btn btn-outline"
                        onClick={handleNextPage}
                        style={{
                          visibility: (pageIdx + 1) * ITEMS_PER_PAGE < activeBook.items.length ? 'visible' : 'hidden',
                          padding: '5px 10px', fontSize: '0.7rem',
                          borderColor: pal.glow, color: pal.glow
                        }}
                      >
                        Next →
                      </button>
                    </div>
                  </div>

                  {/* Bookmark — close trigger */}
                  <div
                    className="bk-bookmark"
                    onClick={e => { e.stopPropagation(); setOpenId(null); }}
                    style={{ background: pal.glow }}
                    title="Close book"
                  >
                    <span className="bk-bookmark-text">X CLOSE</span>
                  </div>

                  <span className="bk-page-num">{pageIdx * 2 + 2}</span>
                  <div className="bk-corner bk-corner-br" style={{ borderColor: pal.glow, opacity: 0.12 }} />
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function ContactPage() {
      const [form, setForm] = useState({ name: '', email: '', message: '' });
      const [status, setStatus] = useState('idle'); // idle | sending | sent | error
      const [showModal, setShowModal] = useState(false);
      const set = k => e => setForm({ ...form, [k]: e.target.value });

      const isValidEmail = (email) => {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      };

      const handleSend = async () => {
        if (!form.name.trim() || !form.email.trim() || !form.message.trim()) {
          setStatus('error');
          setTimeout(() => setStatus('idle'), 3000);
          return;
        }

        if (!isValidEmail(form.email)) {
          setStatus('error');
          setTimeout(() => setStatus('idle'), 3000);
          return;
        }

        setStatus('sending');

        try {
          const response = await fetch('https://formspree.io/f/xqedwzjq', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify(form)
          });

          if (response.ok) {
            setStatus('sent');
            setShowModal(true);
            setForm({ name: '', email: '', message: '' });
            setTimeout(() => setStatus('idle'), 3000);
          } else {
            throw new Error('Formspree returned an error');
          }
        } catch (error) {
          console.error('Error sending message:', error);
          setStatus('error');
          setTimeout(() => setStatus('idle'), 3000);
        }
      };

      return (
        <div className="page page-fade">
          {showModal && (
            <div className="contact-modal-overlay" onClick={() => setShowModal(false)}>
              <div className="contact-modal" onClick={e => e.stopPropagation()}>
                <div className="contact-modal-body">
                  {/* Checkmark icon */}

                    <svg width="64" height="64" viewBox="0 0 64 64" fill="none">

    /* ============================== APP ROOT ============================== */
    function App() {
      const [theme, setTheme] = useState('light');
      const [activeHash, setActiveHash] = useState('#section-index');

      const [autoThemeDisabled, setAutoThemeDisabled] = useState(false);
      const [hasPromptedForTheme, setHasPromptedForTheme] = useState(false);
      const [showThemePrompt, setShowThemePrompt] = useState(false);
      const [promptTheme, setPromptTheme] = useState('light'); // theme at the time the popup was triggered

      const themeRef = React.useRef(theme);
      themeRef.current = theme;

      const autoThemeDisabledRef = React.useRef(autoThemeDisabled);
      autoThemeDisabledRef.current = autoThemeDisabled;

      const toggleTheme = () => {
        const current = themeRef.current;
        const next = current === 'dark' ? 'light' : 'dark';
        setTheme(next);
        document.documentElement.setAttribute('data-theme', next);

        if (!hasPromptedForTheme && !autoThemeDisabledRef.current) {
          setHasPromptedForTheme(true);
          setPromptTheme(current);
          setTimeout(() => {
            setShowThemePrompt(true);
          }, 50);
        }
      };

      // ── Scroll-section theme alternator ──
      React.useEffect(() => {
        const raf = requestAnimationFrame(() => {
          const sections = Array.from(document.querySelectorAll('.scrollable-section'));
          if (!sections.length) return;

          let currentIdx = -1;

          const applyTheme = (idx) => {
            if (idx === currentIdx) return;
            currentIdx = idx;

            // Always update where the user is
            const id = sections[idx]?.getAttribute('id');
            if (id) {
              const hash = '#' + id;
              setActiveHash(hash);
              history.replaceState(null, null, hash);
            }

            // Only switch theme if auto-theme is enabled
            if (!autoThemeDisabledRef.current) {
              // Index + About = light mode; Projects, Blogs, Contact = dark mode
              const next = idx <= 1 ? 'light' : 'dark';
              setTheme(next);
              document.documentElement.setAttribute('data-theme', next);
            }
          };

          const observer = new IntersectionObserver((entries) => {
            let bestIdx = currentIdx;
            let bestRatio = -1;
            entries.forEach(entry => {
              if (entry.isIntersecting && entry.intersectionRatio > bestRatio) {
                bestRatio = entry.intersectionRatio;
                bestIdx = parseInt(entry.target.getAttribute('data-scroll-index'), 10);
              }
            });
            if (bestRatio > 0) applyTheme(bestIdx);
          }, {
            threshold: [0, 0.15, 0.3, 0.5, 0.7, 1.0],
            rootMargin: '-20% 0px -20% 0px'
          });

          sections.forEach(el => observer.observe(el));

          const onScroll = () => {
            const mid = window.innerHeight / 2;
            let best = null, bestDist = Infinity;
            sections.forEach((el, i) => {
              const r = el.getBoundingClientRect();
              const centerY = (r.top + r.bottom) / 2;
              const dist = Math.abs(centerY - mid);
              if (r.bottom > 0 && r.top < window.innerHeight && dist < bestDist) {
                bestDist = dist;
                best = i;
              }
            });
            if (best !== null) applyTheme(best);
          };

          window.addEventListener('scroll', onScroll, { passive: true });
          // Initialize active based on current scroll or hash
          setTimeout(() => {
            const hash = window.location.hash;
            if (hash) {
              const target = document.querySelector(hash);
              if (target) target.scrollIntoView();
            }
            onScroll();
          }, 100);

          return () => {
            observer.disconnect();
            window.removeEventListener('scroll', onScroll);
          };
        });

        return () => cancelAnimationFrame(raf);
      }, []);

      const setPage = (id) => { window.location.hash = '#section-' + id; };

      return (
        <>
          <Cursor />
          <ParticleSystem theme={theme} />
          <Navbar activeHash={activeHash} theme={theme} toggleTheme={toggleTheme} />
          <ScrollIndicator activeHash={activeHash} />
          <ToastMessage />

          {showThemePrompt && (
            <div className="retro-overlay" onClick={() => setShowThemePrompt(false)}>
              <div className="retro-dialog" data-theme={promptTheme} onClick={e => e.stopPropagation()}>
                <div className="retro-dialog-body">
                  {/* Gear icon */}
                  <svg className="retro-dialog-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="32" cy="32" r="30" fill="var(--accent)" opacity="0.15" />
                    <circle cx="32" cy="32" r="28" fill="var(--accent)" />
                    <path d="M42.5 33.5c.1-.5.2-1 .2-1.5s-.1-1-.2-1.5l3.2-2.5c.3-.2.4-.6.2-1l-3-5.2c-.2-.3-.6-.4-.9-.3l-3.8 1.5c-.8-.6-1.7-1.1-2.6-1.5l-.6-4c-.1-.3-.4-.5-.7-.5h-6c-.4 0-.7.2-.7.5l-.6 4c-.9.4-1.8.9-2.6 1.5l-3.8-1.5c-.3-.1-.7 0-.9.3l-3 5.2c-.2.3-.1.7.2 1l3.2 2.5c-.1.5-.2 1-.2 1.5s.1 1 .2 1.5l-3.2 2.5c-.3.2-.4.6-.2 1l3 5.2c.2.3.6.4.9.3l3.8-1.5c.8.6 1.7 1.1 2.6 1.5l.6 4c.1.3.4.5.7.5h6c.4 0 .7-.2.7-.5l.6-4c.9-.4 1.8-.9 2.6-1.5l3.8 1.5c.3.1.7 0 .9-.3l3-5.2c.2-.3.1-.7-.2-1l-3.2-2.5zM32 37.5c-3 0-5.5-2.5-5.5-5.5s2.5-5.5 5.5-5.5 5.5 2.5 5.5 5.5-2.5 5.5-5.5 5.5z" fill="var(--bg)" />
                  </svg>
                  <div className="retro-heading">Theme Info</div>
                  <p className="retro-body-text">
                    Theme switches automatically as you scroll
                    <em>or click the logo to toggle manually.</em>
                  </p>
                  <div className="retro-btn-row">
                    <button className="retro-btn retro-btn-no" onClick={() => setShowThemePrompt(false)}>
                      Keep Auto
                    </button>
                    <button className="retro-btn retro-btn-yes" onClick={() => { setAutoThemeDisabled(true); setShowThemePrompt(false); }}>
                      Disable Auto
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          <div style={{ paddingTop: '80px', display: 'flex', flexDirection: 'column', gap: '30px' }}>
            <section id="section-index" className="scrollable-section" data-scroll-index="0" style={{ scrollMarginTop: '60px' }}>
              <IndexPage setPage={setPage} />
            </section>
            <section id="section-about" className="scrollable-section" data-scroll-index="1" style={{ scrollMarginTop: '60px' }}>
              <AboutPage />
            </section>
            <section id="section-projects" className="scrollable-section" data-scroll-index="2" style={{ scrollMarginTop: '60px' }}>
              <ProjectsPage />
            </section>
            <section id="section-blogs" className="scrollable-section" data-scroll-index="3" style={{ scrollMarginTop: '60px' }}>
              <BlogsPage />
            </section>
            <section id="section-contact" className="scrollable-section" data-scroll-index="4" style={{ scrollMarginTop: '60px', paddingBottom: '40px' }}>
              <ContactPage />
            </section>
          </div>

          <Footer />
        </>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
