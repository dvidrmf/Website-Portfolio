<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ryna David — Full Stack Developer</title>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    /* ============================== RESET & ROOT VARIABLES ============================== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* DARK MODE (Terminal Retro) */
    :root {
      --bg: #080d0a;
      --bg2: #0c1210;
      --bg3: #101810;
      --surface: #141e14;
      --border: #1e3020;
      --accent: #39ff14;
      --accent2: #00ffaa;
      --accent-dim: #0a2010;
      --text: #98c898;
      --text-dim: #4a7a4a;
      --text-bright: #e0ffe0;
      --red: #ff4444;
      --yellow: #FAA52D;
      --teal: #4dc3c3;
      --orange: #FAA52D;
      --font: 'JetBrains Mono', monospace;
      --font2: 'Space Grotesk', sans-serif;
      --transition: 0.25s ease;
      --logo-r: #39ff14;
      --logo-circles: #FAA52D;
      --card-glow: 0 0 20px rgba(57, 255, 20, 0.08), 0 4px 24px rgba(0, 0, 0, 0.5);
      /* Modal theme vars */
      --modal-bg: #0e1a10;
      --modal-surface: #0a1a2e;
      --modal-border: #1a3a1a;
      --modal-text: #98c898;
      --modal-text-dim: #4a7a4a;
      --modal-text-bright: #e0ffe0;
      --modal-accent: #39ff14;
      --accent2: #00ffaa;
      --modal-window-bg: #0a1428;
      --modal-window-bar: #0f1e3a;
      --modal-window-border: #1a3a8e;
      --modal-window-text: #aabbcc;
      --modal-name-color: #e0ffe0;
      --modal-info-color: #88aacc;
      --modal-section-color: #39ff14;
      --modal-item-color: #98c898;
      --modal-skill-border: #39ff14;
    }

    /* LIGHT MODE (High-End Studio) */
    [data-theme="light"] {
      --bg: #F2F0EF;
      --bg2: #E8E6E5;
      --bg3: #FFFFFF;
      --surface: #FAFAF9;
      --border: rgba(1, 67, 70, 0.12);
      --accent: #E15824;
      --accent2: #0A31A7;
      --accent-dim: rgba(225, 88, 36, 0.08);
      --text: #2a3a2a;
      --text-dim: #6a7a6a;
      --text-bright: #0a0a0a;
      --red: #cc2222;
      --yellow: #886600;
      --teal: #014346;
      --orange: #E15824;
      --logo-r: #000000;
      --logo-circles: #014346;
      --card-glow: 0 10px 30px rgba(1, 67, 70, 0.05), 0 0 15px rgba(250, 165, 45, 0.1);
      /* Modal theme vars - light */
      --modal-bg: #F2F0EF;
      --modal-surface: #EDE3D8;
      --modal-border: rgba(10, 49, 167, 0.2);
      --modal-text: #2a2a4a;
      --modal-text-dim: #6a6a8a;
      --modal-text-bright: #0a0a2a;
      --modal-accent: #E15824;
      --accent2: #0A31A7;
      --modal-window-bg: #EDE3D8;
      --modal-window-bar: #d8cfc8;
      --modal-window-border: #0A31A7;
      --modal-window-text: #4a4a7a;
      --modal-name-color: #0a0a2a;
      --modal-info-color: #3a3a6a;
      --modal-section-color: #E15824;
      --modal-item-color: #2a2a4a;
      --modal-skill-border: #0A31A7;
    }

    /* ============================== GLOBAL STYLES ============================== */
    html {
      scroll-behavior: smooth;
    }

    * {
      cursor: none !important;
    }

    /* Restore native cursor on touch/mobile devices */
    @media (hover: none) and (pointer: coarse) {
      * {
        cursor: auto !important;
      }
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 52px;
      position: relative;
      transition: background 0.65s ease, color 0.65s ease;
    }

    /* Smooth theme transitions on all border/shadow consumers */
    *,
    *::before,
    *::after {
      transition-property: border-color, box-shadow, background-color, color, opacity;
      transition-duration: 0.5s;
      transition-timing-function: ease;
    }

    /* Override: keep animations/transforms instant */
    .sdot,
    .skill-bar-fill,
    .tag,
    .nav-btn,
    .btn,
    .card,
    .proj-cell,
    .bk-portal,
    .tc-inner,
    .fc-drawer-chevron {
      transition: unset;
    }

    .sdot {
      animation: pulse 2s infinite;
    }

    .skill-bar-fill {
      transition: width 1s ease;
    }

    .tag {
      transition: box-shadow 0.2s, background 0.2s;
    }

    .nav-btn {
      transition: all var(--transition);
    }

    .btn {
      transition: all var(--transition);
    }

    .card {
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .proj-cell {
      transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
    }

    .bk-portal {
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.3, 0.64, 1);
    }

    .tc-inner {
      transition: transform 0.72s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .fc-drawer-chevron {
      transition: transform 0.3s ease;
    }

    /* CRT Scanline - dark only */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(0deg,
          transparent,
          transparent 3px,
          rgba(0, 0, 0, 0.025) 3px,
          rgba(0, 0, 0, 0.025) 4px);
      pointer-events: none;
      z-index: 9997;
      transition: opacity 0.4s;
    }

    [data-theme="light"] body::before {
      opacity: 0;
    }

    /* Vignette - dark only */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.5) 100%);
      pointer-events: none;
      z-index: 9996;
      transition: opacity 0.4s;
    }

    [data-theme="light"] body::after {
      opacity: 0;
    }

    /* ==============================  CURSOR AND PARTICLES CANVAS ============================== */
    #cursor-canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 99999;
    }

    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 99999;
      opacity: 1;
    }

    /* ============================== NAVBAR ============================== */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      min-height: 52px;
      height: auto;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      z-index: 1000;
      transition: background 0.4s, border-color 0.4s;
    }

    .nav-logo {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }

    .nav-logo-prefix {
      color: var(--text-dim);
      font-weight: 400;
    }

    .nav-links {
      display: flex;
      gap: 2px;
      align-items: center;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      font-family: var(--font);
      font-size: 0.76rem;
      color: var(--text-dim);
      background: none;
      border: 1px solid transparent;
      border-radius: 4px;
      transition: var(--transition);
    }

    .nav-btn:hover {
      color: var(--text);
      border-color: var(--border);
      background: var(--surface);
    }

    .nav-btn.active {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .nav-icon {
      font-style: normal;
      font-size: 0.95em;
      line-height: 1;
    }

    /* Theme toggle button with logo image */
    .theme-btn {
      margin-left: 10px;
      position: relative;
      width: 48px;
      height: 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      transition: border-color var(--transition);
    }

    .theme-btn:hover {
      border-color: var(--accent);
    }

    .theme-btn-tooltip {
      position: absolute;
      bottom: -38px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-family: var(--font);
      font-size: 0.58rem;
      color: var(--text-dim);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 3px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 100;
    }

    .theme-btn:hover .theme-btn-tooltip {
      opacity: 1;
    }

    .theme-btn-svg {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==============================
       GRID BACKGROUND
    ============================== */
    .grid-bg {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    /* ==============================
       PAGE CONTAINER
    ============================== */
    .page {
      min-height: calc(100vh - 52px - 52px);
      margin-top: 52px;
      padding: 40px 28px;
      max-width: 1080px;
      margin-left: auto;
      margin-right: auto;
      position: relative;
      z-index: 1;
    }

    /* ==============================
       PAGE HEADER
    ============================== */
    .page-hd {
      margin-bottom: 36px;
    }

    .page-title-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }

    .page-title-icon {
      width: 46px;
      height: 46px;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15em;
      flex-shrink: 0;
    }

    .page-h1 {
      font-size: 2.1rem;
      font-weight: 700;
      color: var(--text-bright);
      font-style: italic;
    }

    .breadcrumb {
      font-size: 0.78rem;
      color: var(--accent);
    }

    .breadcrumb em {
      color: var(--text-dim);
      font-style: normal;
    }

    /* ==============================
       TERMINAL BLOCK
    ============================== */
    .term {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 28px;
      box-shadow: var(--card-glow);
      transition: background 0.4s, border-color 0.4s, box-shadow 0.4s;
    }

    .term-hd {
      background: var(--surface);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.75rem;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .dr {
      background: #ff5f57;
    }

    .dy {
      background: #ffbd2e;
    }

    .dg {
      background: var(--accent);
    }

    .term-bd {
      padding: 18px 20px;
      font-size: 0.85rem;
      line-height: 1.8;
    }

    .tc {
      color: var(--accent);
    }

    .tp {
      color: var(--text-dim);
    }

    .tv {
      color: var(--text);
    }

    .tk {
      color: var(--teal);
    }

    .ti {
      padding-left: 18px;
    }

    .tree-row {
      color: var(--text-dim);
      font-size: 0.8rem;
      line-height: 1.7;
    }

    .tree-row.child {
      padding-left: 14px;
      display: flex;
      align-items: center;
    }

    .tree-row.child::before {
      content: '├── ';
      flex-shrink: 0;
      white-space: pre;
    }

    .tree-row.child.last::before {
      content: '└── ';
      flex-shrink: 0;
      white-space: pre;
    }

    .tree-row.folder {
      color: var(--text-dim);
    }

    /* ==============================
       STATUS BADGE
    ============================== */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px 14px;
      border-radius: 4px;
      font-size: 0.76rem;
      margin-bottom: 18px;
    }

    .sdot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        box-shadow: 0 0 6px var(--accent);
      }

      50% {
        opacity: 0.3;
        box-shadow: none;
      }
    }

    .stext {
      color: var(--accent);
    }

    /* ==============================
       BUTTONS
    ============================== */
    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 20px;
      font-family: var(--font);
      font-size: 0.78rem;
      border-radius: 4px;
      border: 1px solid;
      transition: var(--transition);
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 700;
    }

    .btn-primary:hover {
      background: transparent;
      color: var(--accent);
    }

    .btn-outline {
      background: transparent;
      color: var(--accent);
      border-color: var(--accent);
    }

    .btn-outline:hover {
      background: var(--accent-dim);
    }

    /* ==============================
       INDEX PAGE HERO
    ============================== */
    .index-top {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 40px;
      align-items: start;
      margin-bottom: 36px;
    }

    .hero-tagline {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .hero-h1 {
      font-size: 2.4rem;
      font-weight: 400;
      color: var(--text-bright);
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .hero-h1 strong {
      display: block;
      font-size: 2.9rem;
      color: var(--accent);
      font-style: italic;
      font-weight: 800;
    }

    .hero-desc {
      font-size: 0.88rem;
      color: var(--text-dim);
      line-height: 1.9;
      margin-bottom: 26px;
    }

    /* Photo/Logo Box - Hover reveals resume */
    .hero-box {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--card-glow);
      transition: border-color 0.4s, box-shadow 0.4s;
    }

    .hero-box:hover {
      border-color: var(--accent);
    }

    .hero-box-hd {
      background: var(--surface);
      padding: 8px 12px;
      font-size: 0.73rem;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      min-height: 34px;
      position: relative;
    }

    .hero-hd-default,
    .hero-hd-hover {
      transition: opacity 0.3s ease;
    }

    .hero-hd-hover {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
    }

    .hero-box:hover .hero-hd-default {
      opacity: 0;
    }

    .hero-box:hover .hero-hd-hover {
      opacity: 1 !important;
    }

    .hero-rhs-hover {
      position: absolute;
      right: 12px;
    }

    .hero-box:hover .hero-rhs-default {
      opacity: 0 !important;
    }

    .hero-box:hover .hero-rhs-hover {
      opacity: 1 !important;
    }

    .hero-box-body {
      position: relative;
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Logo SVG display (default) */
    .hero-logo-view {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, transform 0.4s ease;
      padding: 24px;
    }

    .hero-logo-view svg {
      width: 100%;
      max-width: 180px;
      height: auto;
      filter: drop-shadow(0 0 16px var(--accent));
      transition: filter 0.4s;
    }

    [data-theme="light"] .hero-logo-view svg {
      filter: drop-shadow(0 4px 12px rgba(1, 67, 70, 0.2));
    }

    /* Resume overlay on hover */
    .hero-resume-view {
      position: absolute;
      inset: 0;
      background: var(--bg3);
      padding: 18px;
      overflow-y: auto;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
    }

    .hero-box:hover .hero-logo-view {
      opacity: 0;
      transform: scale(0.95);
    }

    .hero-box:hover .hero-resume-view {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    /* Header label swap on hover - handled above */

    /* Mini resume styles */
    .mini-resume {
      font-family: var(--font);
      font-size: 0.68rem;
      line-height: 1.7;
    }

    .mini-resume .mr-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 2px;
    }

    .mini-resume .mr-title {
      color: var(--accent);
      font-size: 0.72rem;
      margin-bottom: 12px;
    }

    .mini-resume .mr-section {
      margin-bottom: 10px;
    }

    .mini-resume .mr-sec-head {
      color: var(--accent);
      font-weight: 700;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      padding-bottom: 3px;
      margin-bottom: 5px;
    }

    .mini-resume .mr-item {
      color: var(--text);
      margin-bottom: 2px;
    }

    .mini-resume .mr-item span {
      color: var(--text-dim);
    }

    .mini-skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 4px;
    }

    .mini-skill-tag {
      background: var(--accent-dim);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 0.6rem;
      padding: 1px 5px;
      border-radius: 2px;
    }

    /* ==============================
       CARDS
    ============================== */
    .card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 22px;
      margin-bottom: 18px;
      transition: border-color var(--transition), box-shadow var(--transition);
      box-shadow: var(--card-glow);
    }

    .card:hover {
      border-color: var(--accent);
    }

    .card-label {
      font-size: 0.7rem;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .card-h2 {
      font-size: 1.05rem;
      color: var(--text-bright);
      margin-bottom: 8px;
    }

    .card-p {
      font-size: 0.85rem;
      color: var(--text);
      line-height: 1.8;
    }

    .skill-row {
      margin-top: 14px;
    }

    .skill-lbl {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 14px;
    }

    .tag {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 0.68rem;
      font-family: var(--font);
      padding: 2px 8px;
      border-radius: 2px;
      letter-spacing: 0.03em;
      transition: box-shadow 0.2s, background 0.2s;
      position: relative;
    }

    .tag::before {
      content: '--';
      opacity: 0.45;
      margin-right: 2px;
      font-size: 0.6em;
      vertical-align: middle;
    }

    .tag:hover {
      background: var(--accent-dim);
      box-shadow: 0 0 8px var(--accent), 0 0 2px var(--accent);
    }

    [data-theme="light"] .tag:hover {
      box-shadow: 0 0 6px rgba(225, 88, 36, 0.4);
    }

    /* ==============================
       ABOUT PAGE
    ============================== */
    .about-grid {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .see-more-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: var(--font);
      font-size: 0.72rem;
      padding: 5px 12px;
      border-radius: 4px;
      margin-top: 14px;
      transition: var(--transition);
    }

    .see-more-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .see-more-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s ease;
    }

    .see-more-content.open {
      max-height: 300px;
    }

    .see-more-text {
      margin-top: 14px;
      font-size: 0.78rem;
      color: var(--text);
      line-height: 1.8;
      border-left: 2px solid var(--accent);
      padding-left: 14px;
    }

    .dl-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding: 8px 18px;
      font-family: var(--font);
      font-size: 0.75rem;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 4px;
      font-weight: 700;
      transition: var(--transition);
    }

    .dl-btn:hover {
      opacity: 0.85;
    }

    /* ==============================
       PROJECT CELLS (external link cards)
    ============================== */
    .proj-cell {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: var(--card-glow);
      transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
    }

    .proj-cell:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 0 0 1px var(--accent),
        0 0 20px rgba(57, 255, 20, 0.15),
        0 8px 32px rgba(0, 0, 0, 0.5);
      animation: borderPulse 1.5s ease-in-out infinite;
    }

    [data-theme="light"] .proj-cell:hover {
      box-shadow: 0 0 0 1px var(--accent),
        0 0 14px rgba(225, 88, 36, 0.15),
        0 8px 24px rgba(0, 0, 0, 0.08);
      animation: none;
    }

    @keyframes borderPulse {

      0%,
      100% {
        box-shadow: 0 0 0 1px var(--accent), 0 0 14px rgba(57, 255, 20, 0.12), 0 8px 32px rgba(0, 0, 0, 0.5);
      }

      50% {
        box-shadow: 0 0 0 1px var(--accent), 0 0 28px rgba(57, 255, 20, 0.28), 0 8px 32px rgba(0, 0, 0, 0.5);
      }
    }

    .proj-cell-hd {
      background: var(--surface);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .proj-cell-name {
      font-size: 0.72rem;
      color: var(--accent);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .proj-cell-ext {
      font-size: 0.65rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }

    .proj-cell:hover .proj-cell-ext {
      color: var(--accent);
    }

    .proj-cell-body {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .proj-cell-title {
      font-size: 0.95rem;
      color: var(--text-bright);
      font-weight: 600;
    }

    .proj-cell-desc {
      font-size: 0.82rem;
      color: var(--text);
      line-height: 1.8;
      flex: 1;
    }

    .proj-cell-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ============================== BLOG LIST LAYOUT ============================== */
    .blog-list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .blog-list-cmd {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-bright);
      font-style: italic;
    }

    .blog-list-cmd em {
      color: var(--accent);
      font-style: normal;
    }

    .blog-list-count {
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .blog-list-wrap {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 24px;
      box-shadow: var(--card-glow);
    }

    .blog-row {
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 108px 1fr;
      gap: 0 22px;
      transition: background 0.2s;
    }

    .blog-row:last-child {
      border-bottom: none;
    }

    .blog-row:hover .blog-row-title {
      color: var(--accent);
    }

    .blog-row-date {
      font-size: 0.68rem;
      color: var(--text-dim);
      padding-top: 3px;
      white-space: nowrap;
      line-height: 1.6;
    }

    .blog-row-date .date-dot {
      color: var(--accent);
      font-size: 0.7rem;
      margin-right: 3px;
    }

    .blog-row-title {
      font-size: 1.05rem;
      color: var(--text-bright);
      font-weight: 600;
      margin-bottom: 7px;
      line-height: 1.4;
      transition: color 0.2s;
    }

    .blog-row-excerpt {
      font-size: 0.82rem;
      color: var(--text-dim);
      line-height: 1.7;
      margin-bottom: 10px;
    }

    .blog-row-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .blog-row-tag {
      font-size: 0.62rem;
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text-dim);
      background: var(--surface);
      transition: border-color 0.2s, color 0.2s;
    }

    .blog-row:hover .blog-row-tag {
      border-color: var(--accent);
      color: var(--accent);
    }

    .blog-row-expand-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-family: var(--font);
      font-size: 0.65rem;
      padding: 0;
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: color 0.2s;
    }

    .blog-row-expand-btn:hover {
      color: var(--accent);
    }

    .blog-row-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s ease, opacity 0.3s ease;
      opacity: 0;
    }

    .blog-row-content.open {
      max-height: 900px;
      opacity: 1;
    }

    .blog-row-content-inner {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .blog-content-para {
      font-size: 0.85rem;
      color: var(--text);
      line-height: 1.9;
      margin-bottom: 12px;
    }

    .blog-code-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      padding: 14px 16px;
      font-size: 0.72rem;
      color: var(--accent);
      line-height: 1.7;
      margin-bottom: 14px;
    }

    /* ============================== ABOUT — TWO-COLUMN LAYOUT ============================== */
    .about-two-col {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 24px;
      align-items: start;
    }

    /* about-two-col stacking is handled in the consolidated @media (max-width: 767px) block below */

    /* Left: terminal-style about.md card */
    .about-main-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--card-glow);
    }

    .about-card-bar {
      background: var(--surface);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .about-card-body {
      padding: 22px 24px;
    }

    .about-card-text {
      font-size: 0.86rem;
      color: var(--text);
      line-height: 1.9;
      margin-bottom: 14px;
    }

    .about-card-text strong {
      color: var(--accent);
      font-weight: 700;
    }

    /* Skill bars */
    .skill-bars {
      margin: 18px 0;
    }

    .skill-bar-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 24px;
    }

    .skill-bar-item {
      margin-bottom: 6px;
    }

    .skill-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .skill-bar-label span:last-child {
      color: var(--accent);
    }

    .skill-bar-track {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .skill-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 1s ease;
    }

    /* Right sidebar */
    .about-sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Hide STACK.JSON on desktop, show on mobile */
    .about-stack-card {
      display: none;
    }

    .about-side-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--card-glow);
    }

    .about-side-hd {
      padding: 10px 16px;
      font-size: 0.68rem;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .about-side-body {
      padding: 16px;
    }

    .about-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      font-size: 0.72rem;
      border-bottom: 1px solid var(--border);
    }

    .about-info-row:last-child {
      border-bottom: none;
    }

    .about-info-key {
      color: var(--text-dim);
    }

    .about-info-val {
      color: var(--text-bright);
      font-weight: 600;
    }

    .about-info-val.status-av {
      color: var(--accent);
    }

    .about-dl-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 9px 14px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      font-family: var(--font);
      font-size: 0.72rem;
      margin-top: 12px;
      text-decoration: none;
      transition: var(--transition);
    }

    .about-dl-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .about-stack-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
      font-size: 0.72rem;
      border-bottom: 1px solid var(--border);
    }

    .about-stack-row:last-child {
      border-bottom: none;
    }

    .about-stack-arrow {
      color: var(--accent);
      font-size: 0.6rem;
    }

    .about-stack-name {
      color: var(--text-bright);
    }

    /* Personal section inside two-col */
    .about-personal-wrap {
      margin-top: 0;
      grid-column: 1 / -1;
    }

    .personal-sub-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
    }

    .personal-sub-tab {
      background: none;
      border: 1px solid transparent;
      border-bottom: none;
      color: var(--text-dim);
      font-family: var(--font);
      font-size: 0.7rem;
      padding: 6px 16px;
      border-radius: 6px 6px 0 0;
      position: relative;
      bottom: -1px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .personal-sub-tab:hover {
      color: var(--text);
    }

    .personal-sub-tab.active {
      border-color: var(--border);
      border-bottom-color: var(--bg3);
      background: var(--bg3);
      color: var(--accent);
    }

    .personal-sub-content {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 22px 24px;
    }

    /* ============================== ABOUT PAGE ============================== */
    .about-tab-row {
      display: flex;
      gap: 4px;
      margin-bottom: 0;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0;
    }

    .about-tab {
      background: none;
      border: 1px solid transparent;
      border-bottom: none;
      color: var(--text-dim);
      font-family: var(--font);
      font-size: 0.72rem;
      padding: 7px 14px;
      border-radius: 6px 6px 0 0;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      position: relative;
      bottom: -1px;
    }

    .about-tab:hover {
      color: var(--text);
    }

    .about-tab.active {
      border-color: var(--border);
      border-bottom-color: var(--bg3);
      background: var(--bg3);
      color: var(--accent);
    }

    .about-tab-num {
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 0.6rem;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 700;
    }

    .about-tab-content {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 28px 28px;
      box-shadow: var(--card-glow);
    }

    .about-section-title {
      font-size: 1.3rem;
      color: var(--text-bright);
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .about-section-icons {
      font-size: 0.9rem;
      color: var(--text-dim);
      display: flex;
      gap: 6px;
    }

    .about-body-text {
      font-size: 0.82rem;
      color: var(--text);
      line-height: 1.9;
      margin-bottom: 16px;
    }

    .about-config-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 18px;
      font-size: 0.76rem;
      color: var(--text-dim);
      line-height: 1.8;
      margin-top: 10px;
    }

    .about-config-block .cfg-comment {
      color: var(--text-dim);
    }

    .about-config-block .cfg-key {
      color: var(--teal);
    }

    .about-config-block .cfg-val {
      color: var(--accent);
    }

    /* ============================== BLOGS PAGE ============================== */
    .blog-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 22px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      transition: border-color var(--transition);
      box-shadow: var(--card-glow);
    }

    .blog-card:hover {
      border-color: var(--accent);
    }

    .blog-lbl {
      font-size: 0.7rem;
      color: var(--accent);
      margin-bottom: 5px;
      font-weight: 700;
    }

    .blog-title {
      font-size: 0.9rem;
      color: var(--text-bright);
      margin-bottom: 8px;
    }

    .blog-meta {
      display: flex;
      gap: 14px;
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    .blog-arr {
      color: var(--text-dim);
      font-size: 0.75rem;
      transition: color var(--transition), transform var(--transition);
    }

    .blog-card:hover .blog-arr {
      color: var(--accent);
      transform: translateX(4px);
    }

    /* ============================== CONTACT PAGE ============================== */
    .contact-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .info-box {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: var(--card-glow);
    }

    .info-item {
      margin-bottom: 10px;
      font-size: 0.8rem;
    }

    .info-k {
      color: var(--text-dim);
      margin-bottom: 2px;
    }

    .info-v {
      color: var(--text);
    }

    .social-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .soc-btn {
      width: 44px;
      height: 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 1rem;
      text-decoration: none;
      transition: var(--transition);
    }

    .soc-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .status-box {
      background: var(--accent-dim);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 16px 18px;
      font-size: 0.78rem;
      color: var(--text);
      line-height: 1.7;
    }

    .form-box {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--card-glow);
    }

    .form-hd {
      background: var(--surface);
      padding: 14px 20px;
      font-size: 0.8rem;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
    }

    .form-bd {
      padding: 22px;
    }

    .f-label {
      display: block;
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-bottom: 6px;
      margin-top: 14px;
    }

    .f-label:first-child {
      margin-top: 0;
    }

    .f-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 9px 12px;
      font-family: var(--font);
      font-size: 0.78rem;
      color: var(--text);
      transition: border-color var(--transition);
      resize: vertical;
      min-height: 38px;
    }

    textarea.f-input {
      min-height: 100px;
    }

    .f-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .send-btn {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      background: var(--accent);
      border: none;
      border-radius: 4px;
      font-family: var(--font);
      font-size: 0.82rem;
      font-weight: 700;
      color: #000;
      transition: var(--transition);
    }

    .send-btn:hover {
      opacity: 0.88;
    }

    /* Light mode: orange accent, dark text */
    [data-theme="light"] .send-btn {
      background: var(--accent);
      /* #E15824 — orange */
      color: #fff;
    }

    /* Dark mode: green accent, dark text */
    :root .send-btn {
      background: var(--accent);
      /* #39ff14 — neon green */
      color: #000;
    }

    /* ============================== FOOTER ============================== */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      z-index: 100;
      font-size: 0.74rem;
      transition: background 0.4s, border-color 0.4s;
    }

    .foot-cmd {
      color: var(--text-dim);
    }

    .foot-cmd strong {
      color: var(--accent);
    }

    .foot-socials {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .foot-soc {
      color: var(--text-dim);
      text-decoration: none;
      transition: color var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 4px;
    }

    .foot-soc:hover {
      color: var(--accent);
    }

    .foot-soc svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ============================== ADAPTIVE LOGO SVG ============================== */
    .logo-stroke {
      fill: var(--logo-r);
      transition: fill 0.4s ease;
    }

    .logo-circles {
      fill: var(--logo-circles);
      transition: fill 0.4s ease;
    }

    /* Navbar theme button sizing */
    .theme-btn {
      width: 40px;
      height: 36px;
    }

    /* ============================== HERO BOX HOVER LABEL ============================== */
    .hero-hover-label {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: var(--font);
      font-size: 0.68rem;
      padding: 4px 10px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 10;
    }

    .hero-box:hover .hero-hover-label {
      opacity: 1;
    }

    /* ============================== RESUME MODAL ============================== */
    .resume-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeInOverlay 0.25s ease;
    }

    @keyframes fadeInOverlay {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .resume-modal {
      background: var(--modal-bg);
      border: 1px solid var(--accent);
      border-radius: 12px;
      width: 100%;
      max-width: 560px;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 0 60px rgba(57, 255, 20, 0.15), 0 24px 80px rgba(0, 0, 0, 0.6);
      animation: slideUpModal 0.3s ease;
      position: relative;
    }

    [data-theme="light"] .resume-modal {
      box-shadow: 0 0 40px rgba(1, 67, 70, 0.12), 0 24px 80px rgba(0, 0, 0, 0.2);
    }

    @keyframes slideUpModal {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .resume-modal-hd {
      background: var(--surface);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      border-radius: 12px 12px 0 0;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .resume-modal-title {
      font-family: var(--font);
      font-size: 0.78rem;
      color: var(--accent);
      font-weight: 700;
    }

    .resume-close-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: var(--font);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 4px;
      transition: var(--transition);
    }

    .resume-close-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .resume-modal-body {
      padding: 24px 28px;
    }

    /* Resume card styles */
    .rm-window {
      background: var(--modal-window-bg);
      border: 2px solid var(--modal-window-border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .rm-window-bar {
      background: var(--modal-window-bar);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--modal-window-text);
      border-bottom: 1px solid var(--modal-window-border);
    }

    .rm-window-body {
      padding: 16px 18px;
    }

    .rm-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--modal-name-color);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .rm-info {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--modal-info-color);
      line-height: 1.8;
    }

    .rm-info a {
      color: var(--modal-accent);
      text-decoration: none;
    }

    .rm-section-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      font-weight: 700;
      color: var(--modal-section-color);
      margin: 14px 0 8px;
      letter-spacing: 0.05em;
    }

    .rm-timeline {
      display: flex;
      align-items: center;
      gap: 0;
      margin: 10px 0 4px;
      position: relative;
    }

    .rm-tl-line {
      flex: 1;
      height: 2px;
      background: linear-gradient(to right, #1a2a6e, #3a5aee);
      position: relative;
    }

    .rm-tl-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1a2a6e;
      border: 2px solid #3a5aee;
      flex-shrink: 0;
    }

    .rm-tl-labels {
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      color: #555;
      margin-bottom: 12px;
    }

    .rm-skills-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 8px 0;
    }

    .rm-skill-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: #fff;
    }

    .rm-worked-item {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--modal-item-color);
      padding: 3px 0;
      letter-spacing: 0.03em;
    }

    .rm-skills-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 6px 0;
    }

    .rm-badge {
      border: 1.5px solid var(--accent2);
      border-radius: 20px;
      padding: 3px 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--modal-text);
    }

    /* ============================== RESPONSIVE ============================== */
    @media (max-width: 768px) {

      /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
         1. NAVBAR — icons large, no overlap
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
      nav {
        height: auto;
        min-height: 52px;
        /* Generous horizontal padding so logo and theme-btn never collide */
        padding: 6px 10px;
        flex-wrap: nowrap;
        gap: 4px;
      }

      /* Keep logo visible but compact */
      .nav-logo {
        font-size: 0.82rem;
        flex-shrink: 0;
        white-space: nowrap;
      }

      /* Drop the ~/ prefix; retain the accent text */
      .nav-logo-prefix {
        display: none;
      }

      .nav-links {
        gap: 1px;
        flex-shrink: 1;
      }

      /* Icon-only buttons with generous tap area */
      .nav-btn {
        padding: 8px 10px;
        /* bigger tap target */
        font-size: 0;
        /* hide any leftover text */
        gap: 0;
        min-width: 36px;
        justify-content: center;
      }

      /* Hide text labels — icons carry the meaning */
      .nav-label {
        display: none;
      }

      /* 🏠︎ 🗎 ⊞ 🗒 ✉ — clearly legible unicode symbols */
      .nav-icon {
        font-size: 1.35rem;
        /* significantly larger */
        line-height: 1;
        font-style: normal;
        display: inline-block;
      }

      /* Theme toggle — fixed size, won't overlap logo */
      .theme-btn {
        margin-left: 4px;
        width: 38px;
        height: 32px;
        flex-shrink: 0;
      }

      /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
         HERO LAYOUT — single column, box below text
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

      /* Page padding */
      .page {
        padding: 20px 14px;
      }

      /* Stack hero columns vertically (overrides inline style via specificity) */
      .index-top {
        display: grid !important;
        grid-template-columns: 1fr !important;
        gap: 24px !important;
        align-items: start !important;
        /* Text column first, hero-box second — natural DOM order works */
      }

      /* Fluid, non-bleeding hero heading */
      .hero-h1 {
        font-size: clamp(1.3rem, 5.5vw, 2rem);
        word-break: break-word;
        overflow-wrap: break-word;
      }

      .hero-h1 strong {
        font-size: clamp(1.45rem, 7vw, 2.4rem);
        display: block;
        word-break: break-word;
        overflow-wrap: break-word;
        max-width: 100%;
      }

      .hero-desc {
        font-size: clamp(0.72rem, 2.8vw, 0.8rem);
        word-break: break-word;
        overflow-wrap: break-word;
      }

      /* Hero box: full width, centred, reasonable max-width */
      .hero-box {
        width: 100%;
        max-width: 380px;
        margin: 0 auto;
      }

      .hero-box-body {
        min-height: 200px;
      }

      /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
         TERMINAL — reduce indentation, prevent bleed
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

      .term-bd {
        padding: 12px 10px;
        font-size: 0.75rem;
        word-break: break-word;
        overflow-wrap: break-word;
        overflow-x: hidden;
        max-width: 100%;
      }

      /* Halve the indent so content has more breathing room */
      .ti {
        padding-left: 10px;
      }

      /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
         GENERAL POLISH
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

      /* Page headers fluid */
      .page-h1 {
        font-size: clamp(1.2rem, 5vw, 1.9rem);
        word-break: break-word;
      }

      /* Blog list — no horizontal scroll */
      .blog-list-wrap {
        word-break: break-word;
        overflow-wrap: break-word;
        max-width: 100%;
        overflow-x: hidden;
        padding: 0 12px;
      }

      /* Blog rows stack */
      .blog-row {
        grid-template-columns: 1fr;
        gap: 4px;
      }

      .blog-row-date {
        white-space: normal;
      }

      /* Two-col layouts collapse */
      .about-two-col {
        grid-template-columns: 1fr;
      }

      .contact-wrap {
        grid-template-columns: 1fr;
      }

      /* Card body text fluid */
      .card-p {
        font-size: clamp(0.72rem, 2.8vw, 0.8rem);
      }

      /* Scroll indicator text hidden */
      .scroll-label {
        display: none;
      }

      /* Footer hidden on mobile */
      footer {
        display: none !important;
      }

      /* Hide custom cursor canvas on mobile */
      #cursor-canvas,
      #particle-canvas {
        display: none !important;
      }

      /* Toast — fix mobile bleeding */
      .toast-msg {
        padding: 0 14px;
        height: auto;
        min-height: 48px;
        flex-wrap: wrap;
        gap: 4px;
        padding-top: 10px;
        padding-bottom: 10px;
        box-sizing: border-box;
        width: 100%;
        left: 0;
        right: 0;
      }

      .toast-msg-text {
        font-size: 0.68rem;
        line-height: 1.5;
        white-space: normal;
        word-break: break-word;
        flex: 1;
        min-width: 0;
      }

      .toast-msg-hint {
        flex-shrink: 0;
      }

      /* Global overflow guard */
      .page,
      .term,
      .term-bd,
      .blog-list-wrap,
      .about-main-card,
      .about-card-body,
      .card {
        max-width: 100%;
        overflow-x: hidden;
      }

      /* Hide project config console block on mobile */
      .about-config-block {
        display: none !important;
      }

      /* Hide skill bars entirely on mobile */
      .skill-bar-grid {
        display: none !important;
      }

      /* Show STACK.JSON on mobile */
      .about-stack-card {
        display: block !important;
      }

      /* Hide scroll indicator arrows on mobile */
      .scroll-indicator {
        display: none !important;
      }

      /* Hide standard hero-box on mobile, show CRT monitor instead */
      .hero-box {
        display: none !important;
      }

      .crt-monitor {
        display: block !important;
      }

      /* On mobile: always show photo, hide logo, update header */
      .hero-logo-view {
        opacity: 0 !important;
        pointer-events: none;
      }

      .hero-resume-view {
        opacity: 1 !important;
        transform: translateY(0) !important;
        pointer-events: all !important;
      }

      .hero-hd-default {
        display: none !important;
      }

      .hero-hd-hover {
        opacity: 1 !important;
        position: static !important;
        transform: none !important;
      }

      /* Replace "click for resume" with "click to preview resume" on mobile */
      .hero-resume-hint {
        font-size: 0 !important;
      }

      .hero-resume-hint::after {
        content: 'tap to preview resume';
        font-size: 0.6rem;
        color: var(--text-dim);
        opacity: 0.7;
      }
    }

    /* ============================== CRT MONITOR (mobile only) ============================== */
    .crt-monitor {
      display: none;
    }

    @keyframes crtFlicker {

      0%,
      100% {
        opacity: 1;
      }

      45% {
        opacity: 0.97;
      }

      50% {
        opacity: 1;
      }

      90% {
        opacity: 0.98;
      }
    }

    @keyframes slideShowA {

      0%,
      45% {
        opacity: 1;
      }

      50%,
      95% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    @keyframes slideShowB {

      0%,
      45% {
        opacity: 0;
      }

      50%,
      95% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    .crt-monitor-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 300px;
      margin: 0 auto;
    }

    .crt-bezel {
      width: 100%;
      background: linear-gradient(160deg, #3a3a3a 0%, #2a2a2a 40%, #1e1e1e 100%);
      border: 3px solid #111;
      border-radius: 14px;
      padding: 14px 14px 18px;
      box-shadow:
        inset 3px 3px 0 rgba(255, 255, 255, 0.08),
        inset -3px -3px 0 rgba(0, 0, 0, 0.5),
        0 12px 40px rgba(0, 0, 0, 0.7),
        0 2px 8px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .crt-title-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 0 10px;
      font-family: var(--font);
      font-size: 0.62rem;
      color: #888;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      position: relative;
    }

    .crt-screen-bezel {
      border-radius: 8px;
      background: #000;
      padding: 6px;
      box-shadow:
        inset 0 0 18px rgba(0, 0, 0, 0.9),
        inset 0 2px 6px rgba(0, 0, 0, 0.8);
      position: relative;
      cursor: pointer;
    }

    .crt-screen {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      background: #000;
      animation: crtFlicker 4s ease-in-out infinite;
    }

    .crt-screen::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.18) 2px,
          rgba(0, 0, 0, 0.18) 4px);
      z-index: 10;
      pointer-events: none;
      border-radius: 4px;
    }

    .crt-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
      z-index: 11;
      pointer-events: none;
      border-radius: 4px;
    }

    .crt-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .crt-slide-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      animation: slideShowA 6s ease-in-out infinite;
    }

    .crt-slide-photo {
      animation: slideShowB 6s ease-in-out infinite;
      background: #000;
    }

    .crt-slide-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .crt-name-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.82));
      padding: 28px 14px 12px;
      text-align: center;
      z-index: 5;
      pointer-events: none;
    }

    .crt-name-overlay .crt-name {
      font-family: var(--font);
      font-size: 0.85rem;
      color: #fff;
      font-weight: 700;
      display: block;
    }

    .crt-name-overlay .crt-role {
      font-family: var(--font);
      font-size: 0.62rem;
      color: var(--accent);
      margin-top: 3px;
      display: block;
    }

    .crt-neck {
      display: none;
    }

    .crt-base {
      width: 110px;
      height: 12px;
      background: linear-gradient(to bottom, #333, #1e1e1e);
      border-radius: 0 0 8px 8px;
      margin: 0 auto;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .crt-tap-label {
      font-family: var(--font);
      font-size: 0.6rem;
      color: var(--text-dim);
      text-align: center;
      margin-top: 10px;
      opacity: 0.6;
      letter-spacing: 0.05em;
    }

    /* ============================== PAGE TRANSITION ============================== */
    .page-fade {
      animation: pageFadeIn 0.3s ease;
    }

    @keyframes pageFadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ============================== PERSONAL TOGGLE SECTION ============================== */
    .personal-toggle-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 24px;
      margin-bottom: 0;
      padding: 10px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px 8px 0 0;
      border-bottom: none;
    }

    .personal-toggle-label {
      font-size: 0.72rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .personal-toggle-label span {
      font-style: italic;
    }

    .personal-toggle-btn {
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: var(--font);
      font-size: 0.68rem;
      padding: 4px 12px;
      border-radius: 4px;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .personal-toggle-btn:hover {
      background: var(--accent);
      color: #000;
    }

    .personal-section {
      border: 1px solid var(--border);
      border-radius: 0 0 8px 8px;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.6s ease, opacity 0.4s ease;
    }

    .personal-section.open {
      max-height: 2200px;
      opacity: 1;
    }

    .personal-section-inner {
      padding: 22px 24px;
      background: var(--bg3);
    }

    /* ============================== 3D BOOK LIBRARY ============================== */

    /* Per-book CSS custom property for the glow color */
    .bookshelf-hint {
      font-size: 0.66rem;
      color: var(--text-dim);
      font-family: var(--font);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .bookshelf-hint::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    /* ── SHELF PLANK ── */
    .shelf-plank {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 5px;
      align-items: flex-end;
      padding: 22px 18px 14px;
      min-height: 170px;
      position: relative;
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: visible;
    }

    /* Dark mode shelf */
    :root .shelf-plank {
      background: linear-gradient(180deg, #111a11 0%, #0a100a 100%);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(57, 255, 20, 0.04);
    }

    /* Light mode shelf */
    [data-theme="light"] .shelf-plank {
      background: linear-gradient(180deg, #ede4d6 0%, #d8ccb8 100%);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    /* ── BOOK UNIT WRAPPER ── */
    .book-unit {
      position: relative;
      perspective: 700px;
      cursor: pointer !important;
      flex-shrink: 0;
      z-index: 1;
      transition: z-index 0s;
    }

    .book-unit:hover {
      z-index: 20;
    }

    .book-unit.book-open {
      z-index: 20;
    }

    /* ── 3D BOOK BODY ── */
    .book-3d {
      position: relative;
      width: 58px;
      transform-style: preserve-3d;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.35s ease;
    }

    /* Hover: tilt + neon glow intensifies */
    .book-unit:not(.book-open):hover .book-3d {
      transform: rotateY(-14deg) rotateX(4deg) translateY(-10px) scale(1.06);
    }

    /* SPINE face — front of the 3D book */
    .book-spine-el {
      width: 58px;
      border-radius: 3px 5px 5px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 5px 8px;
      font-family: var(--font);
      font-size: 0.52rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      user-select: none;
      overflow: hidden;
      position: relative;
      transition: box-shadow 0.35s ease;
    }

    /* Spine groove lines */
    .book-spine-el::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(90deg,
          transparent 0px, transparent 8px,
          rgba(255, 255, 255, 0.03) 8px, rgba(255, 255, 255, 0.03) 9px);
      pointer-events: none;
    }

    /* Spine binding*/
    .book-spine-el::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 7px;
      background: rgba(0, 0, 0, 0.22);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* Neon glow on hover */
    :root .book-unit:not(.book-open):hover .book-spine-el {
      box-shadow:
        0 0 10px var(--bk-glow, #39ff14),
        0 0 22px color-mix(in srgb, var(--bk-glow, #39ff14) 50%, transparent),
        0 0 45px color-mix(in srgb, var(--bk-glow, #39ff14) 25%, transparent),
        inset 0 0 10px color-mix(in srgb, var(--bk-glow, #39ff14) 12%, transparent),
        3px 6px 18px rgba(0, 0, 0, 0.5);
    }

    /* Light mode: softer shadow glow */
    [data-theme="light"] .book-unit:not(.book-open):hover .book-spine-el {
      box-shadow:
        0 0 8px color-mix(in srgb, var(--bk-glow, #E15824) 40%, transparent),
        0 0 18px color-mix(in srgb, var(--bk-glow, #E15824) 20%, transparent),
        3px 6px 14px rgba(0, 0, 0, 0.12);
    }

    /* Side depth */
    .book-side {
      position: absolute;
      top: 2px;
      right: -7px;
      width: 7px;
      height: calc(100% - 4px);
      border-radius: 0 3px 3px 0;
      background: rgba(0, 0, 0, 0.35);
      transform: rotateY(90deg);
      transform-origin: left center;
    }

    [data-theme="light"] .book-side {
      background: rgba(0, 0, 0, 0.18);
    }

    /* The small text on the spine */
    .book-spine-label {
      writing-mode: vertical-lr;
      text-orientation: mixed;
      transform: rotate(180deg);
      position: relative;
      z-index: 1;
      line-height: 1;
    }

    .book-spine-code {
      font-size: 0.42rem;
      opacity: 0.55;
      letter-spacing: 0.05em;
      position: relative;
      z-index: 1;
      font-weight: 400;
    }

    /*  Dim effect  */
    .bk-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
    }

    .bk-overlay.bk-overlay-active {
      opacity: 1;
      pointer-events: all;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    :root .bk-overlay {
      background: rgba(4, 10, 4, 0.82);
    }

    [data-theme="light"] .bk-overlay {
      background: rgba(242, 240, 239, 0.78);
    }

    /* ── OPEN BOOK── */
    .bk-portal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.82);
      width: min(780px, 94vw);
      height: min(510px, 82vh);
      z-index: 10001;
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 0.42s cubic-bezier(0.4, 0, 0.2, 1),
        transform 0.42s cubic-bezier(0.34, 1.35, 0.64, 1);
    }

    .bk-portal.bk-portal-open {
      opacity: 1;
      pointer-events: all;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Open book */
    .bk-open-book {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-radius: 4px 10px 10px 4px;
      overflow: hidden;
      position: relative;
    }

    /* Center binding shadow */
    .bk-open-book::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 6px;
      transform: translateX(-50%);
      background: linear-gradient(90deg,
          rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.08) 40%,
          rgba(0, 0, 0, 0.08) 60%, rgba(0, 0, 0, 0.4) 100%);
      z-index: 5;
      pointer-events: none;
    }

    /* Outer book glow */
    .bk-open-book {
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.06),
        0 28px 70px rgba(0, 0, 0, 0.72),
        0 0 55px color-mix(in srgb, var(--bk-active-glow, #39ff14) 18%, transparent);
    }

    [data-theme="light"] .bk-open-book {
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.08),
        0 20px 55px rgba(0, 0, 0, 0.18),
        0 0 35px color-mix(in srgb, var(--bk-active-glow, #E15824) 14%, transparent);
    }

    /* ── LEFT PAGE ── */
    .bk-page-left {
      padding: 26px 22px 22px 26px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border-right: 1px solid rgba(255, 255, 255, 0.04);
    }

    [data-theme="light"] .bk-page-left {
      background: #f7f3ed;
      border-right: 1px solid rgba(0, 0, 0, 0.05);
    }

    :root .bk-page-left {
      background: var(--bg2);
    }

    /* Aged-paper corner shadow */
    .bk-page-left::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 0% 0%, rgba(255, 255, 200, 0.03) 0%, transparent 55%),
        radial-gradient(ellipse at 100% 100%, rgba(0, 0, 0, 0.1) 0%, transparent 50%);
      pointer-events: none;
    }

    /* ── RIGHT PAGE ── */
    .bk-page-right {
      padding: 26px 26px 22px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    [data-theme="light"] .bk-page-right {
      background: #fff;
    }

    :root .bk-page-right {
      background: var(--bg3);
    }

    /* ── PAGE CONTENT STYLES ── */
    .bk-pg-title {
      font-family: var(--font);
      font-size: 1.0rem;
      font-weight: 700;
      font-style: italic;
      margin-bottom: 2px;
      line-height: 1.2;
    }

    .bk-pg-rule {
      width: 100%;
      height: 1px;
      margin-bottom: 12px;
      opacity: 0.35;
    }

    .bk-pg-desc {
      font-family: var(--font);
      font-size: 0.73rem;
      color: var(--text);
      line-height: 1.85;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .bk-pg-cmd {
      font-family: var(--font);
      font-size: 0.63rem;
      opacity: 0.65;
      font-style: italic;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .bk-tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: auto;
    }

    .bk-tag {
      padding: 3px 9px;
      border: 1px solid;
      border-radius: 3px;
      font-family: var(--font);
      font-size: 0.6rem;
      background: rgba(0, 0, 0, 0.15);
    }

    [data-theme="light"] .bk-tag {
      background: rgba(0, 0, 0, 0.04);
    }

    /* Right page items */
    .bk-items-lbl {
      font-family: var(--font);
      font-size: 0.6rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .bk-items-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      flex: 1;
      align-content: start;
    }

    .bk-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 9px 11px;
      transition: border-color 0.18s;
      cursor: default !important;
    }

    .bk-item:hover {
      border-color: var(--bk-active-glow, var(--accent));
    }

    .bk-item-name {
      font-family: var(--font);
      font-size: 0.67rem;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 2px;
    }

    .bk-item-sub {
      font-family: var(--font);
      font-size: 0.58rem;
      color: var(--text-dim);
    }

    /* ── BOOKMARK / CLOSE TAB ── */
    .bk-bookmark {
      position: absolute;
      right: -1px;
      top: 44%;
      transform: translateY(-50%);
      width: 20px;
      padding: 10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px 0 0 5px;
      cursor: pointer !important;
      z-index: 10;
      transition: width 0.2s ease;
      overflow: hidden;
      writing-mode: vertical-lr;
    }

    .bk-bookmark:hover {
      width: 28px;
    }

    .bk-bookmark-text {
      font-family: var(--font);
      font-size: 0.5rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      transform: rotate(180deg);
      pointer-events: none;
      white-space: nowrap;
      color: #000;
    }

    [data-theme="light"] .bk-bookmark-text {
      color: #fff;
    }

    /* Page corner decorations */
    .bk-corner {
      position: absolute;
      width: 18px;
      height: 18px;
      border-style: solid;
      opacity: 0.18;
    }

    .bk-corner-tl {
      top: 12px;
      left: 12px;
      border-width: 1px 0 0 1px;
    }

    .bk-corner-br {
      bottom: 12px;
      right: 12px;
      border-width: 0 1px 1px 0;
    }

    .bk-page-num {
      position: absolute;
      bottom: 9px;
      font-family: var(--font);
      font-size: 0.52rem;
      color: var(--text-dim);
      opacity: 0.5;
    }

    .bk-page-left .bk-page-num {
      left: 18px;
    }

    .bk-page-right .bk-page-num {
      right: 18px;
    }

    /* ============================== TAROT ANIMATION ============================== */

    /* Theme colour tokens */
    :root {
      --tc-glow: #00FF00;
      --tc-border: #00FF00;
      --tc-bg1: #040c04;
      --tc-bg2: #081408;
      --tc-pattern: rgba(0, 255, 0, 0.07);
      --tc-frame: rgba(0, 255, 0, 0.38);
      --tc-star: #00FF00;
      --tc-lbl: rgba(0, 255, 0, 0.82);
    }

    [data-theme="light"] {
      --tc-glow: #FAA52D;
      --tc-border: #FAA52D;
      --tc-bg1: #fff9f0;
      --tc-bg2: #fdecd0;
      --tc-pattern: rgba(250, 165, 45, 0.09);
      --tc-frame: rgba(250, 165, 45, 0.5);
      --tc-star: #FAA52D;
      --tc-lbl: rgba(180, 95, 0, 0.88);
    }

    .tarot-intro {
      font-size: 0.76rem;
      color: var(--text);
      line-height: 1.8;
      margin-bottom: 20px;
    }

    /* The three-card spread */
    .tarot-spread {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 22px;
    }

    /* Outer wrapper — handles the dimming of siblings */
    .tc-outer {
      perspective: 750px;
      cursor: pointer !important;
      transition: opacity 0.3s ease, filter 0.3s ease, transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform, opacity, filter;
    }

    /* When ANY sibling is hovered, dim ALL wrappers… */
    .tarot-spread:has(.tc-outer:hover) .tc-outer {
      opacity: 0.28;
      filter: saturate(0.1) brightness(0.5);
      transform: scale(0.96);
    }

    /* …then snap the actually-hovered one back to full + scale up */
    .tarot-spread:has(.tc-outer:hover) .tc-outer:hover {
      opacity: 1 !important;
      filter: none !important;
      transform: scale(1.08) !important;
    }

    /* Flipped card never dims */
    .tc-outer.tc-is-flipped {
      opacity: 1 !important;
      filter: none !important;
      transform: scale(1.04) !important;
    }

    /* Inner flip container */
    .tc-inner {
      position: relative;
      width: 100%;
      padding-bottom: 162%;
      transform-style: preserve-3d;
      transition: transform 0.72s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tc-outer.tc-is-flipped .tc-inner {
      transform: rotateY(180deg);
    }

    /* Shared face styles */
    .tc-face {
      position: absolute;
      inset: 0;
      border-radius: 11px;
      backface-visibility: hidden;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── FACE-DOWN (closed) ── */
    .tc-back {
      background: linear-gradient(160deg, var(--tc-bg1) 0%, var(--tc-bg2) 100%);
      border: 2px solid var(--tc-border);
      box-shadow: 0 0 24px color-mix(in srgb, var(--tc-glow) 38%, transparent),
        inset 0 0 28px rgba(0, 0, 0, 0.25);
    }

    /* Diamond hatching overlay */
    .tc-back::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 9px;
      background-image:
        repeating-linear-gradient(45deg, var(--tc-pattern) 0, var(--tc-pattern) 1px, transparent 1px, transparent 13px),
        repeating-linear-gradient(-45deg, var(--tc-pattern) 0, var(--tc-pattern) 1px, transparent 1px, transparent 13px);
    }

    .tc-frame {
      position: relative;
      width: 54%;
      height: 50%;
      border: 1.5px solid var(--tc-frame);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tc-frame::before {
      content: '';
      position: absolute;
      inset: 5px;
      border: 1px solid color-mix(in srgb, var(--tc-frame) 45%, transparent);
      border-radius: 3px;
    }

    .tc-star {
      font-size: 2.2rem;
      position: relative;
      z-index: 1;
      color: var(--tc-star);
      text-shadow: 0 0 14px var(--tc-glow), 0 0 28px var(--tc-glow);
      animation: tcStarPulse 2.6s ease-in-out infinite;
    }

    @keyframes tcStarPulse {

      0%,
      100% {
        opacity: 1;
        text-shadow: 0 0 14px var(--tc-glow), 0 0 28px var(--tc-glow);
      }

      50% {
        opacity: 0.5;
        text-shadow: 0 0 3px var(--tc-glow);
      }
    }

    .tc-name {
      position: absolute;
      bottom: 10px;
      font-family: var(--font);
      font-size: 0.52rem;
      color: var(--tc-lbl);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
    }

    .tc-hint-dot {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--tc-glow) 75%, transparent);
      animation: tcStarPulse 1.9s ease-in-out infinite;
    }

    /* ── FACE-UP (revealed) ── */
    .tc-front {
      transform: rotateY(180deg);
      background: var(--bg3);
      border: 2px solid var(--tc-border);
      box-shadow: 0 0 22px color-mix(in srgb, var(--tc-glow) 28%, transparent);
      padding: 14px 12px;
      gap: 7px;
    }

    .tc-up-icon {
      font-size: 2rem;
      text-align: center;
    }

    .tc-up-title {
      font-family: var(--font);
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--tc-lbl);
      text-align: center;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tc-up-rule {
      width: 55%;
      height: 1px;
      background: var(--tc-border);
      opacity: 0.45;
      align-self: center;
    }

    .tc-up-desc {
      font-family: var(--font);
      font-size: 0.57rem;
      color: var(--text);
      line-height: 1.68;
      text-align: center;
      flex: 1;
    }

    .tc-up-hint {
      font-family: var(--font);
      font-size: 0.5rem;
      color: var(--text-dim);
      text-align: center;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Glow ring beneath card — also theme-adaptive */
    .tc-glow-ring {
      width: 74%;
      height: 7px;
      background: radial-gradient(ellipse,
          color-mix(in srgb, var(--tc-glow) 55%, transparent) 0%,
          transparent 70%);
      margin: 4px auto 0;
      border-radius: 50%;
      opacity: 0.65;
      transition: opacity 0.3s;
    }

    .tc-outer:hover .tc-glow-ring {
      opacity: 1.6;
    }

    /* Symbolic social */
    .symbolic-social-row {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .sym-soc-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 6px;
      font-family: var(--font);
      font-size: 0.68rem;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid;
      transition: var(--transition);
    }

    .sym-soc-ig {
      background: linear-gradient(135deg, #833ab4 0%, #fd1d1d 50%, #fcb045 100%);
      color: #fff;
      border-color: transparent;
    }

    .sym-soc-ig:hover {
      opacity: 0.85;
    }

    .sym-soc-tt {
      background: #000;
      color: #fff;
      border-color: #333;
    }

    [data-theme="light"] .sym-soc-tt {
      background: #111;
    }

    .sym-soc-tt:hover {
      border-color: var(--accent);
    }

    /* Download Resume button */
    .dl-resume-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      background: var(--accent);
      color: #000;
      border: 2px solid var(--accent);
      border-radius: 6px;
      font-family: var(--font);
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      transition: var(--transition);
      margin-top: 20px;
    }

    .dl-resume-btn:hover {
      background: transparent;
      color: var(--accent);
    }

    /* ============================== PROJECTS — macOS FINDER WINDOW ============================== */

    /* ============================== PROJECTS — SHARED ============================== */

    /* Traffic light buttons */
    .proj-win-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: none;
      transition: filter 0.15s;
      flex-shrink: 0;
    }

    .proj-win-btn:hover {
      filter: brightness(1.15);
    }

    .proj-win-btn.close {
      background: #ff5f57;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 0 0 .5px rgba(0, 0, 0, .25);
    }

    .proj-win-btn.minimise {
      background: #ffbd2e;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 0 0 .5px rgba(0, 0, 0, .25);
    }

    .proj-win-btn.expand {
      background: #28c840;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 0 0 .5px rgba(0, 0, 0, .25);
    }

    /* Shared right-side content panel */
    .proj-file-content {
      flex: 1;
      background: var(--bg3);
      padding: 24px;
      overflow-y: auto;
      min-width: 0;
    }

    [data-theme="light"] .proj-file-content {
      background: #f5f5f5;
    }

    .proj-file-inner {
      background: transparent;
      border: none;
      padding: 0;
    }
